<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Twitch Chat Viewer</title>
<style>
*{
  -webkit-tap-highlight-color: transparent;
}
*{
  -webkit-touch-callout: none;
}
button{
  -webkit-tap-highlight-color: transparent;
}
:root{
  --bg:#0f0f12;
  --panel:#15151b;
  --text:#e7e7ea;
  --muted:#a6a6b0;
  --border:#2a2a35;
  --control-h: 46px;
  --control-radius: 10px;
  --control-gap: 8px;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;

  --controls-w:312px; /* ширина левого блока на десктопе */
  --chat-w:515px;     /* ширина блока сообщений на десктопе */
  --gap:16px;

}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.page{width:100%;display:flex;justify-content:center;padding:0}
.chat{
  width:100%;
  max-width:none;
  margin:0;
}

/* header / controls (mobile first) */
header{
  width:100%;
  max-width:none;
  background:#18181b;
  border-bottom:1px solid var(--border);
  padding:12px;
  box-sizing:border-box;
  position:sticky;
  top:0;
  z-index:50;
  border-radius:0;
  display:flex;
  flex-direction:column;
  gap: var(--control-gap);
  align-items:stretch;
  transition:padding .2s ease, gap .2s ease;
}
.meta{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin:0;
  min-width:0;
  height:100%;
}


.panel-top{
  display:grid;
  grid-template-columns:132px minmax(0,1fr);
  gap:10px;
  min-width:0;
  overflow:visible;
  transition:max-height .25s ease, opacity .2s ease, transform .25s ease, margin .2s ease;
  max-height:1000px;
  opacity:1;
  transform:none;
}

.panel-stats{
  display:flex;
  gap: var(--control-gap);
  align-items:center;
  justify-content:space-between;
  width:100%;
  min-width:0;
}

.panel-stats-main{
  display:flex;
  align-items:center;
  gap: var(--control-gap);
  min-width:0;
  overflow:hidden;
}

.panel-stats-separator{
  color:var(--muted);
  flex:0 0 auto;
}

.panel-stats .pill{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#streamDate{
  min-width:0;
}

.panel-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: var(--control-gap);
  width:100%;
  min-width:0;
}

.vod-heading{
  display:flex;
  align-items:flex-start;
  gap: var(--control-gap);
  min-width:0;
  width:100%;
}

.vod-channel{
  flex:0 1 auto;
  max-width:min(45%, 240px);
  font-size:16px;
  font-weight:700;
  line-height:1.2;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vod-separator{
  flex:0 0 auto;
  color:var(--muted);
  line-height:1.25;
  transform:translateY(0.05em);
}

.vod-title{
  flex:1 1 auto;
  min-width:0;
  font-size:17px;
  font-weight:400;
  line-height:1.3;
  color:var(--text);
  display:-webkit-box;
  -webkit-line-clamp:6;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.vod-title.is-truncated{
  overflow:hidden;
}

.vod-card{
  align-self:start;
  margin-bottom: var(--control-gap);
  border:1px solid rgba(145,70,255,0.25);
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  cursor:pointer;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.vod-card:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}
.vod-card:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:
    0 0 0 3px rgba(145,70,255,0.4),
    0 10px 24px rgba(0,0,0,.35);
}
.vod-card:focus-visible{
  outline:2px solid rgba(145,70,255,0.65);
  outline-offset:2px;
}
.vod-card-media{
  position:relative;
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#22222b,#15151b 55%, #0f0f12);
}
.vod-card-media img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.vod-card-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.06) 35%, rgba(0,0,0,.7) 100%);
}
.pill{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  color:var(--muted);
  font-size:13px;
}
.controls{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap: var(--control-gap);
  margin-top:8px;
  width:100%;
  min-width:0;
}
.controls #q{
  grid-column:1 / span 3;
  grid-row:1;
}

.controls #u{
  grid-column:4 / span 3;
  grid-row:1;
}


.controls-footer{
  grid-column:1 / span 6;
  grid-row:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: var(--control-gap);
  width:100%;
  min-width:0;
}
.controls-footer .pill{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.controls input{
  min-width:0;
  height: var(--control-h);
  font-size:14px;
  padding:0 12px;
  border-radius: var(--control-radius);
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);

}
.button-toggle.active{
  background:var(--panel);
  border-color:var(--border);
}

.toggle-button{
  background:var(--panel);
  border:1px solid var(--border);
}

.toggle-button.is-active{
  background:var(--panel);
  border-color:var(--border);
}

.toggle-button.is-inactive{
  background:var(--panel);
  border-color:var(--border);
}

.meta-buttons{
  display:flex;
  gap: var(--control-gap);
  width:100%;
}

.panel-actions{
  width:100%;
}

.meta-buttons button{
  flex:1;
  height: var(--control-h);
  border-radius: var(--control-radius);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:14px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  transition: background .15s ease, border-color .15s ease, transform .08s ease;
}

.meta-buttons .button-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

button:focus{
  outline:none;
}

button:focus-visible{
  outline:none;
}

button, .vod-card{
  user-select: none;
  -webkit-user-select: none;
}

/* активное состояние */
.meta-buttons button.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

.button-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

.button-toggle:active{
  transform:scale(0.96);
  background:#23232d; /* чуть темнее */
  border-color:#3a3a48;
}

/* неактивное */
.meta-buttons button.is-inactive{
  background:#15151b;
  border-color:var(--border);
  opacity:.7;
}

/* нажатие */
.meta-buttons button:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:0 0 0 3px rgba(145,70,255,0.35);
}

.meta-buttons button:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}

.snapshot-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.snapshot-panel{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  max-width:100%;
}

.snapshot-preview{
  max-width:min(100%, 1200px);
  max-height:min(80vh, 900px);
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
  display:block;
}

.snapshot-actions{
  display:flex;
  justify-content:flex-end;
  gap: var(--control-gap);
  width:100%;
  opacity:0;
  pointer-events:none;
  max-width: var(--controls-w);
}

.snapshot-actions.is-ready{
  opacity:1;
  pointer-events:auto;
}

/* Only the VOD overlay: let the rendered image determine the action width. */
.vod-preview-panel .snapshot-preview{
  max-width:min(calc(100vw - 40px), 1200px);
}
.vod-preview-panel .snapshot-actions{
  width:0;
  min-width:100%;
  max-width:none;
}

.vod-live-panel{align-items:center;}
.vod-live-panel .snapshot-actions{width:auto;min-width:0;}
.vod-live-panel > button{flex:none;min-height:44px;}
.vod-live-panel button:focus-visible{outline:2px solid #9146ff;outline-offset:2px;}
.vod-card[aria-disabled="true"]{cursor:default;}

.snapshot-toggle{
  height: var(--control-h);
  border-radius: var(--control-radius);
  padding:0 14px;
  font-size:14px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;

  transition: background .15s ease, border-color .15s ease, transform .08s ease;

  flex:1;
}

.snapshot-loader{
  width:60px;
  height:60px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#fff;
  animation:spin 1s linear infinite;
  align-self:center;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* активное */
.snapshot-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

/* неактивное */
.snapshot-toggle.is-inactive{
  opacity:.7;
}

/* нажатие */
.snapshot-toggle:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:0 0 0 3px rgba(145,70,255,0.35);
}

/* hover (не ломает active) */
.snapshot-toggle:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}

/* Measured rows, not the browser's fallback anchor, own document positioning. */
html{overflow-anchor:none;}

/* message list */
#list{
  overflow-anchor:none; /* Measured windows own scroll anchoring. */
  width:100%;
  max-width:390px;
  margin-left:auto;
  margin-right:auto;
  background:#1f1f23;
  min-height:100vh;
  padding-bottom:40px;
  margin-top:0;
  border-radius:0;
  overflow-x:hidden;
}

/* row */
.row{
  display:block;
  padding:6px 12px;
  line-height:1.4;
  overflow-wrap:anywhere;
}
/* Text-template hints, adapted to TCD; not a pixel copy of Twitch. */
.row.notice{border-left:3px solid #a970ff;border-bottom:2px solid #1f1f23;padding-left:9px;background:#292334;}
.row.notice-watch_streak{border-left-color:#49b8a6;background:#20312f;}
.row.notice-community_gift,.row.notice-gift{border-left-color:#d6ae62;background:#322c22;}
.notice-system{color:#e0dce8;white-space:pre-wrap;overflow-wrap:anywhere;}
.notice-icon{width:15px;height:15px;vertical-align:-2px;margin-right:6px;color:#bf94ff;}
.notice-watch_streak .notice-icon{color:#68cfbd;}
.notice-community_gift .notice-icon,.notice-gift .notice-icon{color:#e3bf7d;}
.notice-comment{display:block;padding-top:4px;}
.notice-comment .msg{white-space:pre-wrap;}
.time{
  color:#adadb8;
  white-space:nowrap;
  margin-right:6px;
}
.user{
  display:inline;
  font-weight:600;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  min-width:0;
  max-width:100%;
}

.colon{
  display:inline;
  color:var(--text);
  margin-right:6px;          /* пространство между ':' и началом сообщения */
  white-space:nowrap;
}
.msg{
  display:inline;
  flex:0 1 auto;
  color:var(--text);
  overflow-wrap:anywhere;
  word-break:break-word;
  min-width:0;
}
.badges{
  display:inline-flex;
  align-items:center;
  gap:2px;
  margin-right:4px;
  vertical-align:middle;
  flex:0 0 auto;
}
.badge{
  width:18px;
  height:18px;
  display:inline-block;
  vertical-align:middle;
  object-fit:contain;
  image-rendering:auto;
}

.emote{
  vertical-align: -0.2em;
  margin: 0 2px;
}

.panel-stats img{
  height: 1em;
}

#mobileChannel img{
  height: 1.3em;
  width: 1.3em;
  object-fit: contain;
}

#mobileChannel{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-start;
}

#mobileChannel span{
  margin-left: 2px;
}

/* export helper (unchanged) */
.export-wrap{
  position:fixed;
  left:-99999px;
  top:0;
  width:390px;
  background:#18181f;

  padding:16px;           /* ← одинаково сверху и снизу */
  display:inline-block;

  box-sizing:border-box;  /* ← важно */

  overflow:hidden;
}
.export-meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;color:#b9b9c6}

/* ===== Desktop layout ===== */
@media (min-width: 901px){
  .page{padding:24px}
  .chat{max-width: calc(var(--controls-w) + var(--chat-w) + var(--gap)); display:flex; gap:var(--gap); align-items:flex-start}

  /* left column becomes fixed-ish via sticky */
  header{
    width:var(--controls-w);
    max-width:none;
    flex:0 0 var(--controls-w);
    position:sticky;
    top:24px; /* offset from viewport top */
    border-radius:14px;
    padding:20px;
    height:fit-content;
  }

  /* make controls vertical and full width of left column */
  .controls{
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    margin-top:2px;
    align-items:stretch;
  }

  .controls input{
    width:100%;
    height: var(--control-h);
    font-size:14px;
    padding:0 12px;
    flex:0 0 auto;
  }

  .panel-stats{
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    row-gap: 4px;
  }

  .panel-stats-channel{
    width: 100%;
    grid-column: 1 / -1; /* вся строка */
  }

  #stat{
    grid-column: 1 / -1;
    justify-self: start;
  }
  .panel-stats > .pill:not(.panel-stats-channel){
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    overflow-wrap:anywhere;
  }
  /* messages column */
  #list{
    width:var(--chat-w);
    max-width:var(--chat-w);
    flex:0 0 var(--chat-w);
    border-radius:14px;
    min-height:calc(100vh - 48px);
    margin-top:0; /* header is in left column, not above messages */
  }

  /* center whole layout horizontally */
  .page{justify-content:center}
}

/* small refinements for very narrow phones (so content not glued to edges) */
@media (max-width:420px){
  .chat{padding:0 8px}
  header{padding:10px;border-radius:12px}
  #list{margin-top:0;border-radius:0}
}



@media (max-width: 900px){

  header .panel-top{order:0;}
  header .panel-stats{order:1;}
  header .live-capture-warning{order:2;}
  header .controls{order:3;}
  header .panel-actions{order:4;}


  header.is-expanded .panel-stats{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:6px;
    align-items:start;
  }
  header.is-expanded #mobileChannel{
    display:block;
    grid-column:1 / -1;
    white-space:normal;
    overflow:visible;
    overflow-wrap:anywhere;
  }
  header.is-expanded .panel-stats > .pill:not(.panel-stats-channel){
    white-space:normal;
    overflow:visible;
    overflow-wrap:anywhere;
  }
  header.is-expanded #stat{max-width:100%;justify-self:end;text-align:right;}

  #list{
    padding-top: 145px;
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:auto;
    padding:10px 12px 12px;
    background:#18181b;
    box-shadow:0 18px 40px rgba(0,0,0,.38);
    overflow:visible;
    z-index:80;
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    align-items:stretch;
    touch-action:auto;
    padding-bottom: 32px;
  }




  header.is-expanded .panel-top,
  header.is-expanded .panel-stats{
    opacity:1;
    transform:none;
  }

  .panel-top{
    display:grid;
    grid-template-columns:132px minmax(0,1fr);
    gap:14px;
    min-width:0;
    transition:opacity .2s ease, transform .24s ease;
  }

  .panel-stats{
    display:flex;
    gap: row-gap:6px;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-width:0;
    transition:opacity .2s ease, transform .24s ease;
  }

  .panel-stats .pill{
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .panel-stats-channel{
    flex:1 1 auto;
  }

  .vod-card{
    margin:0;
  }

  .meta{
    margin:0;
  }

  .vod-title{
    -webkit-line-clamp:4;
    font-size:14px;
  }

  .vod-channel{
    font-size:15px;
    max-width:none;
  }

  .controls{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:0;
    min-width:0;
    width:100%;
  }

  .controls input{
    width:100%;
    min-width:0;
    height: var(--control-h);
    font-size:14px;
    padding:0 12px;
  }

  .panel-actions{
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    width:100%;
  }

  .meta-buttons{
    display:flex;
    gap: var(--control-gap);
    width:100%;
    min-width:0;
  }

  .meta-buttons button{
    flex:1 1 0;
    height: var(--control-h);
    font-size:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.24);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }



}
.live-capture-warning{margin:8px 0;padding:8px 10px;border:1px solid #a74444;border-radius:8px;background:rgba(180,45,45,.12);font-size:13px;line-height:1.4;overflow-wrap:anywhere;}
.live-capture-warning[hidden]{display:none;}

/* Desktop wrappers are boxless, preserving the original sidebar geometry. */
.panel-details,.panel-details-content{display:contents;}
.mobile-control-row{display:none;}
@media(max-width:900px){
  header,header.is-compact{padding:8px 24px;gap:0;touch-action:auto;will-change:auto;box-shadow:none;transition:none;}
  .mobile-control-row{display:flex;gap:var(--control-gap);align-items:center;min-width:0;}
  .controls,.meta-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--control-gap);}
  .controls #q{grid-column:1;grid-row:auto;}
  .controls #u{grid-column:2;grid-row:auto;}
  .controls input,.meta-buttons button{height:var(--control-h);min-height:var(--control-h);width:100%;min-width:0;box-sizing:border-box;}
  .panel-details{display:block;order:0;height:0;opacity:0;overflow:hidden;}
  header.is-expanded:not(.is-panel-animating) .panel-details{overflow:visible;}
  .panel-details-content{display:flex;flex-direction:column;gap:var(--control-gap);padding-bottom:8px;}
  /* One measured destination per transition; no per-frame DOM/anchor scans. */
  header.is-panel-animating .panel-details{transition:height 270ms cubic-bezier(.2,0,.2,1),opacity 270ms ease-out;}
  #list.panel-shifting{transition:padding-top 270ms cubic-bezier(.2,0,.2,1);}
  header.is-expanded .panel-stats{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px 16px;}
  header.is-expanded #mobileChannel{display:inline-flex;flex-basis:100%;}
  header.is-expanded .panel-stats > .pill:not(.panel-stats-channel){white-space:nowrap;overflow:visible;overflow-wrap:normal;}
  header.is-expanded #stat{max-width:100%;margin-left:auto;text-align:right;}
  .panel-stats .pill,#streamDate{display:inline-flex;align-items:center;gap:6px;}
  .panel-stats .meta-symbol{display:inline-flex;align-items:center;justify-content:center;flex:none;width:18px;}

<script>
/* DOM is shared by two layouts:
   desktop = sticky sidebar, mobile = 2-column header grid. */


const DATA = JSON.parse(document.getElementById("chat-data").textContent || "{}");
const meta = DATA.meta || {};
if(meta.captured_during_live === true){
  const warning = document.getElementById('liveCaptureWarning');
  warning.textContent = '🔴 Чат получен во время LIVE-трансляции и может быть неполным';
  warning.hidden = false;
}
const rows = DATA.rows || [];
const COMPACT_DATA = DATA.format === 'tcd-compact-v1';
// No rows.map(decode): data stays compact for its entire lifetime. Search reads
// scalar fields directly; only rendered/exported messages need temporary objects.
function messageUser(record){
  if(!COMPACT_DATA) return record.user;
  return (typeof record[1]==='number' ? DATA.users[record[1]] : record[1])[0];
}
function messageText(record){return COMPACT_DATA ? record[2] : record.text;}
function decodeMessage(record){
  if(!COMPACT_DATA) return record;
  const user=typeof record[1]==='number' ? DATA.users[record[1]] : record[1];
  const badges=typeof record[4]==='number' ? DATA.badges[record[4]] : record[4][0];
  const mask=record.length>5 ? record[5] : 63;
  if(mask===63 && record.length<7) return {t:record[0],user:user[0],text:record[2],fragments:record[3],color:user[1],badges};
  const values=[record[0],user[0],record[2],record[3],user[1],badges];
  const keys=['t','user','text','fragments','color','badges'];
  const result=record.length>6 ? {...record[6]} : {};
  for(let i=0;i<keys.length;i++) if(mask & (1<<i)) result[keys[i]]=values[i];
  return result;
}

const MODE = meta.mode || "online";
const LOCAL_EMOTES = meta.local_emotes || {};
const CDN_EMOTES = meta.cdn_emotes || {};
const BADGE_IMAGES = meta.badge_images || {};
const TWITCH_CHANNEL_ID = meta.channel_id || null;

const elTitle=document.getElementById("title");
const elStat=document.getElementById("stat");
const elMobileChannel=document.getElementById("mobileChannel");
const elList=document.getElementById("list");

const elStreamDate=document.getElementById("streamDate");

const elQ=document.getElementById("q");
const elU=document.getElementById("u");
const elToggleTime=document.getElementById("toggleTime");
const elExportBtn=document.getElementById("exportBtn");
const MOBILE_MQ = window.matchMedia("(max-width: 900px)");
const elHeader=document.querySelector("header");
const elScrubber=document.getElementById("fastScrubber");
const elPanelHandle=document.querySelector(".panel-toggle");
let onPanelLayout=()=>()=>{};
const elPanelDetails=document.getElementById("panelDetails");
const elPanelContent=elPanelDetails.firstElementChild;
let panelAnimating=false,panelCleanup=()=>{};
const elVodCard=document.getElementById("vodCard");
const elVodPreviewImg=document.getElementById("vodPreviewImg");
const elVodHeading=document.querySelector(".vod-heading");
let SHOW_TIME=true;
let panelMobile=MOBILE_MQ.matches;
let PANEL_EXPANDED = !panelMobile;

elTitle.textContent = meta.title || "—";
if(elMobileChannel){
  elMobileChannel.textContent = "";

  const img = document.createElement("img");
  img.src = "https://cdn.7tv.app/emote/01H1P0YF7G0008W9SSAM2XE7GF/2x.webp";
  img.className = "channel-icon";

  const text = document.createElement("span");
  text.textContent = meta.channel || "—";

  elMobileChannel.appendChild(img);
  elMobileChannel.appendChild(text);
}

function updateMainTimeButton(){
  elToggleTime.classList.toggle("is-active", SHOW_TIME);
  elToggleTime.classList.toggle("is-inactive", !SHOW_TIME);
  elToggleTime.setAttribute("aria-pressed", SHOW_TIME ? "true" : "false");
}

function fitVodTitle(){
  if(!elTitle) return;
  const maxLines = 3;
  const minFont = 12;
  const maxFont = 15;

  elTitle.style.fontSize = `${maxFont}px`;
  elTitle.classList.remove("is-truncated");

  const cs = getComputedStyle(elTitle);
  const lineHeight = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.22) || 18;
  const maxHeight = lineHeight * maxLines + 1;

  let size = maxFont;
  while(size > minFont && elTitle.scrollHeight > maxHeight){
    size -= 0.5;
    elTitle.style.fontSize = `${size}px`;
  }

  if(elTitle.scrollHeight > maxHeight){
    elTitle.classList.add("is-truncated");
  }
}

updateMainTimeButton();

function clampNumber(value, min, max){
  return Math.max(min, Math.min(max, value));
}


function syncPanelState(expanded, animate=true){
  const settle=onPanelLayout();
  panelCleanup();
  const mobile=MOBILE_MQ.matches;
  const motion=mobile && animate && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  const current=elPanelDetails.getBoundingClientRect().height;
  const currentPadding=parseFloat(getComputedStyle(elList).paddingTop),scrollY=window.scrollY;
  // Freeze the interpolated height on rapid reversal before choosing a new target.
  elHeader.classList.remove('is-panel-animating');
  elList.classList.remove('panel-shifting');
  elPanelDetails.style.height=mobile ? current+'px' : '';
  PANEL_EXPANDED=!!expanded;
  // Keep expanded content geometry while it fades/collapses, then hide it.
  const layoutExpanded=PANEL_EXPANDED || (motion && current>0);
  elHeader.classList.toggle('is-expanded',layoutExpanded);
  elHeader.classList.toggle('is-compact',!layoutExpanded);
  elPanelHandle.setAttribute('aria-expanded',String(PANEL_EXPANDED));
  elPanelHandle.setAttribute('aria-label',PANEL_EXPANDED ? 'Свернуть панель' : 'Развернуть панель');
  elPanelDetails.inert=mobile && !PANEL_EXPANDED;
  elPanelDetails.setAttribute('aria-hidden',String(mobile && !PANEL_EXPANDED));
  const target=mobile && PANEL_EXPANDED ? elPanelContent.getBoundingClientRect().height : 0;
  const insetBase=mobile ? viewportInset()-current : 0;
  const targetPadding=insetBase+target+1;
  panelAnimating=motion && Math.abs(target-current)>.5;
  let follow=()=>{},reserved=currentPadding,scrolling=false;
  const finish=()=>{
    panelCleanup();
    follow(target);
    const previousY=window.scrollY;
    panelAnimating=false;
    elHeader.classList.remove('is-panel-animating');
    elList.classList.remove('panel-shifting');
    elHeader.classList.toggle('is-expanded',PANEL_EXPANDED);
    elHeader.classList.toggle('is-compact',!PANEL_EXPANDED);
    if(mobile) elPanelDetails.style.height=PANEL_EXPANDED ? 'auto' : '0px';
    updatePanelGeometry();
    if(scrolling) window.scrollTo(0,previousY+targetPadding-reserved);
    settle();
  };
  if(panelAnimating){
    // Long chats keep fixed list geometry during the transition. Native scroll
    // compensates the header's interpolated height without repainting all rows
    // or allocating a huge composited layer for the complete virtual window.
    reserved=Math.max(insetBase+current+1,targetPadding);
    elList.style.paddingTop=reserved+'px';
    const startY=scrollY+reserved-currentPadding;
    scrolling=startY>=0 && startY<=document.documentElement.scrollHeight-innerHeight;
    if(scrolling){
      window.scrollTo(0,startY);
      follow=height=>window.scrollTo(0,startY+current-height);
    }else elList.style.paddingTop=(insetBase+current+1)+'px';
    void elPanelDetails.offsetHeight;
    elHeader.classList.add('is-panel-animating');
    if(!scrolling) elList.classList.add('panel-shifting');
    void elPanelDetails.offsetHeight;
    const ended=e=>{if(e.target===elPanelDetails && e.propertyName==='height') finish();};
    const timer=setTimeout(finish,350);
    elPanelDetails.addEventListener('transitionend',ended);
    let frame=0;
    const track=()=>{follow(elPanelDetails.getBoundingClientRect().height);frame=requestAnimationFrame(track);};
    if(scrolling) frame=requestAnimationFrame(track);
    panelCleanup=()=>{clearTimeout(timer);cancelAnimationFrame(frame);elPanelDetails.removeEventListener('transitionend',ended);panelCleanup=()=>{};};
    if(!scrolling) elList.style.paddingTop=targetPadding+'px';
  }
  elPanelDetails.style.height=mobile ? target+'px' : '';
  elPanelDetails.style.opacity=mobile ? (PANEL_EXPANDED ? '1' : '0') : '';
  if(!panelAnimating) finish();
}
syncPanelState(PANEL_EXPANDED,false);
function updatePanelGeometry(){
  if(!panelAnimating) elList.style.paddingTop=MOBILE_MQ.matches ? (viewportInset()+1)+'px' : '';
}
new ResizeObserver(()=>{if(!panelAnimating) updatePanelGeometry();}).observe(elHeader);
function reconcilePanelMode(){
  const mobile=MOBILE_MQ.matches;
  const expanded=mobile!==panelMobile ? !mobile : PANEL_EXPANDED;
  panelMobile=mobile;
  syncPanelState(expanded,false);
}
MOBILE_MQ.addEventListener('change',reconcilePanelMode);
window.addEventListener('resize',()=>{requestAnimationFrame(fitVodTitle);reconcilePanelMode();});
elPanelHandle.addEventListener('click',e=>{e.stopPropagation();syncPanelState(!PANEL_EXPANDED,true);});
let vodOverlay = null;
let vodOverlayToken = 0;

function safeVodUrl(value){
  if(typeof value !== "string" || value.length > 2048) return "";
  try{
    const url = new URL(value);
    if(url.protocol !== "https:" || !["www.twitch.tv", "twitch.tv"].includes(url.hostname)
       || url.username || url.password || url.port || !/^\/videos\/[1-9][0-9]{0,19}\/?$/.test(url.pathname)) return "";
    return url.href;
  }catch(e){ return ""; }
}
const livePreview = meta.captured_during_live === true;
const vodLink = safeVodUrl(meta.vod_url);
// Trusted build-time constants, never data URIs supplied by Twitch metadata.
const fallbackPreview = livePreview ? "{{LIVE_FALLBACK_PNG}}" : "{{VOD_FALLBACK_PNG}}";
function safeThumbnail(value){
  if(typeof value!=="string" || value.length>1024) return "";
  value=value.replace(/%?\{width\}/g,"720").replace(/%?\{height\}/g,"405");
  try{
    const u=new URL(value);
    if(u.protocol!=="https:" || u.host!=="static-cdn.jtvnw.net" || u.username || u.password
       || u.search || u.hash || !/^\/cf_vods\/[A-Za-z0-9_./-]+\.(?:jpe?g|png)$/.test(u.pathname)
       || value.includes("..") || value.includes("\\")) return "";
    return u.href;
  }catch(e){return "";}
}
const safePreview = safeThumbnail(meta.thumbnail_preview_url);
const safeFull = safeThumbnail(meta.thumbnail_full_url);

function openVodOverlay(){
  if(livePreview && !vodLink) return;

  const token = ++vodOverlayToken;
  if(vodOverlay){
    vodOverlay.remove();
  }

  const overlay = document.createElement("div");
  overlay.className = "snapshot-overlay";
  vodOverlay = overlay;

  const panel = document.createElement("div");
  panel.className = "snapshot-panel vod-preview-panel" + (livePreview ? " vod-live-panel" : "");
  if(livePreview){
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", "Открыть VOD");
  }

  // ПРЕВЬЮ
  const preview = livePreview ? null : document.createElement("img");
  if(preview){ preview.className = "snapshot-preview"; preview.alt = ""; }
  if(!livePreview) panel.appendChild(preview);

  // ЛОАДЕР
  const loader = document.createElement("div");
  loader.className = "snapshot-loader";
  if(!livePreview) panel.appendChild(loader);

  // ACTIONS
  const actions = document.createElement("div");
  actions.className = "snapshot-actions";

  const linkBtn = document.createElement("button");
  linkBtn.className = "snapshot-toggle is-active";

  linkBtn.textContent = "🔗 Ссылка на VOD";

  linkBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    if(vodLink){
      window.open(vodLink,"_blank", "noopener,noreferrer");
    }
  });

  if(vodLink) actions.appendChild(linkBtn);
  panel.appendChild(actions);
  overlay.appendChild(panel);

  function closeOverlay(){
    overlay.remove();
    if(vodOverlay === overlay){
      vodOverlay = null;
      vodOverlayToken++;
    }
    document.body.style.overflow = "";
    if(livePreview) elVodCard.focus();
  }
  overlay.addEventListener("click", closeOverlay);
  if(livePreview){
    const closeBtn = document.createElement("button");
    closeBtn.className = "snapshot-toggle";
    closeBtn.textContent = "Закрыть";
    closeBtn.addEventListener("click", closeOverlay);
    panel.appendChild(closeBtn);
    overlay.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){ e.preventDefault(); closeOverlay(); }
      if(e.key === "Tab"){
        e.preventDefault();
        (document.activeElement === linkBtn ? closeBtn : linkBtn).focus();
      }
    });
  }

  panel.addEventListener("click", (e)=>e.stopPropagation());

  document.body.style.overflow = "hidden";
  document.body.appendChild(overlay);

  if(livePreview){
    actions.classList.add("is-ready");
    linkBtn.focus();
    return;
  }

  // ЗАГРУЗКА КАРТИНКИ
  const full = new Image();
  full.onload = ()=>{
    if(token !== vodOverlayToken || vodOverlay !== overlay || !overlay.isConnected) return;
    preview.src = full.src;
    loader.remove();
    actions.classList.add("is-ready");
  };
  full.onerror = ()=>{
    if(token !== vodOverlayToken || vodOverlay !== overlay || !overlay.isConnected) return;
    preview.src = fallbackPreview;
    loader.remove();
    actions.classList.add("is-ready");
  };
  full.src = safeFull || safePreview || fallbackPreview;
}

elVodCard.addEventListener("click", openVodOverlay);
elVodCard.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openVodOverlay(); }
});
if(livePreview && !vodLink){
  elVodCard.setAttribute("aria-disabled", "true");
  elVodCard.tabIndex = -1;
}

const previewUrl = safePreview || safeFull || fallbackPreview;
elVodPreviewImg.style.display = "block";
elVodPreviewImg.addEventListener("error", ()=>{
  // One fallback assignment only, even if the browser cannot decode the resource.
  elVodPreviewImg.src = fallbackPreview;
}, {once:true});
elVodPreviewImg.src = previewUrl;

requestAnimationFrame(fitVodTitle);
window.addEventListener("resize", ()=>requestAnimationFrame(fitVodTitle));
if(elVodHeading && "ResizeObserver" in window){
  const ro = new ResizeObserver(()=>requestAnimationFrame(fitVodTitle));
  ro.observe(elVodHeading);
}

function fmtStreamStart(iso){
  if(typeof iso !== "string") return null;
  iso = iso.trim();
  const parts = /^(\d{4})-(\d{2})-(\d{2})(?:[Tt ](\d{2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?(Z|[+-]\d{2}:?\d{2})?$/.exec(iso);
  if(!parts) return null;
  const [, year, month, day, hour="00", minute="00", second="00", zone="Z"] = parts;
  const y=Number(year), m=Number(month), d=Number(day);
  const leap=y%4===0 && (y%100!==0 || y%400===0);
  const days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  if(y<1 || m<1 || m>12 || d<1 || d>days[m-1] || Number(hour)>23 || Number(minute)>59 || Number(second)>59) return null;
  const date = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}${zone}`);
  if(Number.isNaN(date.getTime())) return null;
  const months=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return `${date.getUTCDate()} ${months[date.getUTCMonth()]} ${String(date.getUTCFullYear()).padStart(4,"0")} ${String(date.getUTCHours()).padStart(2,"0")}:${String(date.getUTCMinutes()).padStart(2,"0")} UTC`;
}
const streamStart = fmtStreamStart(meta.created_at);
if(streamStart){
  setMetadataGroup(elStreamDate,'📅',streamStart);
}
function setMetadataGroup(element,symbol,value){
  const icon=document.createElement('span'),text=document.createElement('span');
  icon.className='meta-symbol';icon.setAttribute('aria-hidden','true');icon.textContent=symbol;
  text.className='meta-value';text.textContent=value;
  // A plain space keeps desktop/export text identical; flex owns mobile gaps.
  element.replaceChildren(icon,document.createTextNode(' '),text);
}

const DEFAULT_COLORS = [
  "#FF0000",
  "#0000FF",
  "#00FF00",
  "#B22222",
  "#FF7F50",
  "#9ACD32",
  "#FF4500",
  "#2E8B57",
  "#DAA520",
  "#D2691E",
  "#5F9EA0",
  "#1E90FF",
  "#FF69B4",
  "#8A2BE2",
  "#00FF7F",
];

function colorForUser(name){
  const u = String(name || "");
  if(!u) return "#adadb8";
  const first = u.charCodeAt(0) || 0;
  const last = u.charCodeAt(u.length - 1) || 0;
  return DEFAULT_COLORS[(first + last) % DEFAULT_COLORS.length];
}
function renderBadges(el, badges){
  const document=el.ownerDocument || globalThis.document;
  if(!Array.isArray(badges) || badges.length === 0) return false;

  let rendered = false;
  const wrap = document.createElement("span");
  wrap.className = "badges";

async function fetch7tvEmotes(channelId){
  if(!channelId) return new Map();
  try{
    const r = await fetch(`https://7tv.io/v3/users/twitch/${channelId}`);
    if(!r.ok) return new Map();
    const json = await r.json();
    const emotes = json?.emote_set?.emotes || [];
    const map = new Map();
    for(const e of emotes){
      const name = e?.name;
      const host = e?.data?.host;
      if(!name||!host) continue;
      const files = host.files || [];
      const file = files.find(f=>f.name==="1x.webp")||files.find(f=>String(f.name).endsWith(".webp"))||files[0];
      if(!file) continue;
      map.set(name,`https:${host.url}/${file.name}`);
    }
    return map;
  }catch(e){ return new Map(); }
}

function catalogEmoteUrl(catalog, name){

  if(!Object.prototype.hasOwnProperty.call(catalog, name)) return null;
  const value = catalog[name];

function renderTextWithEmotes(el,text,emotes){
  const document=el.ownerDocument || globalThis.document;
  const parts = String(text||"").split(/(\s+)/);
  for(const p of parts){
  const clean = p.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'');
    const src = catalogEmoteUrl(LOCAL_EMOTES, clean) || catalogEmoteUrl(CDN_EMOTES, clean);
    if(src){
      const img = document.createElement("img");
      img.src = src; img.crossOrigin="anonymous"; img.alt=p; img.title=p; img.className="emote"; el.appendChild(img);
    } else if(emotes.has(clean)){

    } else {

function renderFragmentsWithEmotes(el, fragments, emotes){
  const document=el.ownerDocument || globalThis.document;
  if(!Array.isArray(fragments) || fragments.length === 0){
    return false;
  }

  let renderedAny = false;
  for(const fragment of fragments){
    if(!fragment || typeof fragment !== "object") continue;

    const rawText = String(fragment.text || "");
    const cleanText = rawText
      .replace(/[\u200B-\u200D\uFEFF]/g,'')
      .replace(/[\r\n\t]/g,'')
      .trim();
    const emoteId = fragment.emoteID || (fragment.emote && (fragment.emote.emoteID || fragment.emote.id)) || null;

    if(emoteId){
      const img = document.createElement("img");
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/1.0`;
      img.crossOrigin="anonymous";
      img.alt = rawText || emoteId;
      img.title = rawText || emoteId;
      img.className="emote";
      el.appendChild(img);
      renderedAny = true;
      continue;
    }

    const src = cleanText && (catalogEmoteUrl(LOCAL_EMOTES, cleanText) || catalogEmoteUrl(CDN_EMOTES, cleanText));
    if(src){
      const img = document.createElement("img");
      img.src = src; img.crossOrigin="anonymous"; img.alt=rawText; img.title=rawText; img.className="emote"; el.appendChild(img);
      renderedAny = true;
      continue;

    if(rawText){

  scrubGesture.moved=true;
  const width=Math.max(1,elScrubber.querySelector('.scrub-track').getBoundingClientRect().width);
  // Keep the fraction independent of rounded row indexes. Clamping also
  // consumes overshoot, so reversing at either endpoint responds immediately.
  const fraction=clampNumber(scrubGesture.fraction+(x-scrubGesture.x)/width,0,1);
  scrubGesture.x=x;scrubGesture.fraction=fraction;
  requestScrub(scrubTarget(fraction,rowCount()));
}
function finishScrub(event){
  if(!scrubGesture || event.pointerId!==scrubGesture.id) return;
  if(event.type==='pointerup') pointerScrub(event.clientX);
  const gesture=scrubGesture;scrubGesture=null;elScrubber.classList.remove('is-held');
  if(elScrubber.hasPointerCapture(gesture.id)) elScrubber.releasePointerCapture(gesture.id);
  if(gesture.moved) requestScrub(scrubIndex);scheduleScrubSync();
}
function beginScrub(x,id){
  scrubGesture={id,x,fraction:scrubPercent(scrubIndex,rowCount())/100};
  elScrubber.classList.add('is-held');
}
elScrubber.addEventListener('pointerdown',event=>{
  if(!MOBILE_MQ.matches || FILTERING || rowCount()<2 || event.button!==0 || event.isPrimary===false || scrubGesture) return;
  event.preventDefault();event.stopPropagation();
  beginScrub(event.clientX,event.pointerId);elScrubber.setPointerCapture(event.pointerId);
});
elScrubber.addEventListener('pointermove',event=>{
  if(!scrubGesture || event.pointerId!==scrubGesture.id) return;
  event.preventDefault();event.stopPropagation();pointerScrub(event.clientX);
});
for(const type of ['pointerup','pointercancel','lostpointercapture']) elScrubber.addEventListener(type,event=>{
  if(!scrubGesture || event.pointerId!==scrubGesture.id) return;
  event.stopPropagation();finishScrub(event);
});
elScrubber.addEventListener('keydown',event=>{
  const step=Math.max(1,Math.round((rowCount()-1)/10));
  const targets={ArrowLeft:scrubIndex-1,ArrowDown:scrubIndex-1,ArrowRight:scrubIndex+1,ArrowUp:scrubIndex+1,PageDown:scrubIndex+step,PageUp:scrubIndex-step,Home:0,End:rowCount()-1};
  if(!Object.prototype.hasOwnProperty.call(targets,event.key)) return;
  event.preventDefault();event.stopPropagation();requestScrub(targets[event.key]);
});
// Touch fallback for engines without Pointer Events; suppression stays local.
elScrubber.addEventListener('touchstart',event=>{
  event.stopPropagation();if('PointerEvent' in window || !MOBILE_MQ.matches || FILTERING || rowCount()<2 || scrubGesture || event.touches.length!==1) return;
  event.preventDefault();beginScrub(event.touches[0].clientX,'touch');
},{passive:false});
elScrubber.addEventListener('touchmove',event=>{
  event.stopPropagation();if(scrubGesture?.id!=='touch') return;
  event.preventDefault();pointerScrub(event.touches[0].clientX);
},{passive:false});
for(const type of ['touchend','touchcancel']) elScrubber.addEventListener(type,event=>{
  event.stopPropagation();if(scrubGesture?.id!=='touch') return;
  const moved=scrubGesture.moved;scrubGesture=null;elScrubber.classList.remove('is-held');if(moved) requestScrub(scrubIndex);scheduleScrubSync();
});
MOBILE_MQ.addEventListener('change',()=>{resetScrubber();scheduleScrubSync();});

/* Selection endpoints belong to logical rows, not ephemeral DOM nodes. A native
   range is projected onto its visible intersection; PNG uses the full range. */
function selectionPoint(node,offset){
  const element=node?.nodeType===3 ? node.parentElement : node;
  const row=element?.closest?.('#list .row');
  if(!row) return null;
  const range=document.createRange();range.selectNodeContents(row);range.setEnd(node,offset);
  return {id:Number(row.dataset.id),offset:range.toString().length};
}
function selectionSignature(sel){
  return sel?.rangeCount ? [sel.anchorNode,sel.anchorOffset,sel.focusNode,sel.focusOffset] : [];
}
function rememberSelection(){
  const sel=window.getSelection();const sig=selectionSignature(sel);
  if(projectedSelection && sig.length===projectedSelection.length && sig.every((v,i)=>v===projectedSelection[i])) return;
  if(selectionGesture?.active && !elList.querySelector(`.row[data-id="${selectionGesture.anchor.id}"]`)){
    const focus=pointAtPointer(selectionGesture.x,selectionGesture.y);
    if(focus){selectionRange={anchor:selectionGesture.anchor,focus};projectSelection();}
    return;
  }
  const anchor=selectionPoint(sel?.anchorNode,sel?.anchorOffset);
  const focus=selectionPoint(sel?.focusNode,sel?.focusOffset);
  if(!anchor || !focus || sel.isCollapsed){selectionRange=null;return;}
  // A clipped native endpoint still represents its original off-window endpoint.
  const same=(a,b)=>a && b && a.id===b.id && a.offset===b.offset;
  const oldAnchor=projectedSelection && selectionPoint(projectedSelection[0],projectedSelection[1]);
  const oldFocus=projectedSelection && selectionPoint(projectedSelection[2],projectedSelection[3]);
  selectionRange={anchor:same(anchor,oldAnchor)&&selectionRange ? selectionRange.anchor : anchor,
                  focus:same(focus,oldFocus)&&selectionRange ? selectionRange.focus : focus};
}
function domPoint(point){
  const first=windowStart*CHUNK,last=Math.min(windowEnd*CHUNK,rowCount())-1;
  const id=Math.max(first,Math.min(last,point.id));
  const row=elList.querySelector(`.row[data-id="${id}"]`);
  if(!row) return null;
  let offset=point.id<first ? 0 : point.id>last ? row.textContent.length : point.offset;
  return textPoint(row,offset);
}
function textPoint(row,offset){
  const walker=row.ownerDocument.createTreeWalker(row,NodeFilter.SHOW_TEXT);
  let node;
  while(node=walker.nextNode()){
    if(offset<=node.length) return [node,offset];
    offset-=node.length;
  }
  return [row,row.childNodes.length];
}
function projectSelection(){
  if(!selectionRange) return;
  const sel=window.getSelection();const {anchor,focus}=selectionRange;
  const a=domPoint(anchor),f=domPoint(focus);
  if(a && f) sel.setBaseAndExtent(...a,...f);
  projectedSelection=selectionSignature(sel);
}
document.addEventListener('selectionchange',()=>{if(!windowBusy) rememberSelection();});
function pointAtPointer(x,y){
  const outside=y<0 || y>=innerHeight;
  const cy=Math.max(0,Math.min(innerHeight-1,y));
  let point;
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(x,cy);
    point=p && selectionPoint(p.offsetNode,p.offset);
  }else{
    const range=document.caretRangeFromPoint?.(x,cy);
    point=range && selectionPoint(range.startContainer,range.startOffset);
  }
  if(point || !outside) return point;
  const visible=[...elList.querySelectorAll('.row')].filter(n=>{
    const r=n.getBoundingClientRect();return r.bottom>0 && r.top<innerHeight;
  });
  const row=y<0 ? visible[0] : visible.at(-1);
  return row && selectionPoint(row,y<0 ? 0 : row.childNodes.length);
}
elList.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse' || e.button!==0) return;
  const anchor=e.shiftKey && selectionRange ? selectionRange.anchor : pointAtPointer(e.clientX,e.clientY);
  if(!e.shiftKey){selectionRange=null;projectedSelection=null;}
  selectionGesture=anchor ? {anchor,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,active:false} : null;
});
window.addEventListener('pointermove',e=>{
  if(!selectionGesture || !(e.buttons&1)) return;
  const gesture=selectionGesture;gesture.x=e.clientX;gesture.y=e.clientY;
  if(Math.abs(e.clientX-gesture.startX)+Math.abs(e.clientY-gesture.startY)>3) gesture.active=true;
  if(gesture.active && !elList.querySelector(`.row[data-id="${gesture.anchor.id}"]`)){
    const focus=pointAtPointer(e.clientX,e.clientY);
    if(focus){selectionRange={anchor:gesture.anchor,focus};projectSelection();}
  }
});
window.addEventListener('pointerup',()=>{rememberSelection();selectionGesture=null;});
window.addEventListener('pointercancel',()=>{selectionGesture=null;});
// Native copy cannot see evicted nodes. Recreate only their textual projection;
// no DOM or image requests are needed. Preserve partial endpoint text offsets.
function selectionText(r,includeTime=SHOW_TIME){
  const notice=r.notice && noticeForRow(r);
  if(notice){
    return (includeTime ? String(r.t||'00:00:00').replace(/\s*:\s*/g,':') : '')+notice.system+
      (notice.comment.trim() ? '\n'+selectionText({...r,notice:null,text:notice.comment,fragments:notice.comment_fragments||[]},false) : '');
  }
  const plain=text=>String(text||'').split(/(\s+)/).filter(p=>{
    const clean=p.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'');
    return !catalogEmoteUrl(LOCAL_EMOTES,clean) && !catalogEmoteUrl(CDN_EMOTES,clean) && !EMOTES.has(clean);
  }).join('');
  let message='';
  if(Array.isArray(r.fragments) && r.fragments.length){
    let rendered=false;
    for(const f of r.fragments){
      if(!f || typeof f!=='object') continue;
      const raw=String(f.text||''),clean=raw.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'').trim();
      if(f.emoteID || f.emote?.emoteID || f.emote?.id || clean && (catalogEmoteUrl(LOCAL_EMOTES,clean) || catalogEmoteUrl(CDN_EMOTES,clean))){rendered=true;continue;}
      if(raw){message+=plain(raw);rendered=true;}
    }
    if(!rendered) message=plain(r.text);
  }else message=plain(r.text);
  return (includeTime ? String(r.t||'00:00:00').replace(/\s*:\s*/g,':') : '')+(r.user||'—')+':'+message;
}
document.addEventListener('copy',event=>{
  rememberSelection();
  if(!selectionRange || !event.clipboardData) return;
  let {anchor:a,focus:f}=selectionRange;
  if(a.id>f.id || a.id===f.id && a.offset>f.offset) [a,f]=[f,a];
  if(a.id>=windowStart*CHUNK && f.id<windowEnd*CHUNK) return;
  const text=[];
  // A document without a browsing context keeps rich clipboard content inert:
  // image URLs are serialized, never fetched for off-window clipboard rows.
  const inert=document.implementation.createHTMLDocument('');
  const rich=inert.createElement('div');
  for(let i=a.id;i<=f.id;i++){
    const item=rowAt(i);
    let line=selectionText(item);
    rich.appendChild(createRowElement(item,SHOW_TIME,i,inert));
    if(i===f.id) line=line.slice(0,f.offset);
    if(i===a.id) line=line.slice(a.offset);
    text.push(line);
  }
  const range=inert.createRange();
  range.setStart(...textPoint(rich.firstChild,a.offset));
  range.setEnd(...textPoint(rich.lastChild,f.offset));
  const selected=inert.createElement('div');selected.appendChild(range.cloneContents());
  event.clipboardData.setData('text/html',selected.innerHTML);
  event.clipboardData.setData('text/plain',text.join('\n'));event.preventDefault();
});


/* Snapshot overlay: render the selected logical rows afresh for every toggle. */
let SNAPSHOT_TIME_ENABLED = SHOW_TIME;
let SNAPSHOT_DATE_ENABLED = false;
let SNAPSHOT_RENDER_TOKEN = 0;
let SNAPSHOT_OVERLAY = null;
let SNAPSHOT_PREVIEW_IMG = null;
let SNAPSHOT_TIME_BTN = null;
let SNAPSHOT_DATE_BTN = null;

function snapshotRows(from,to){
  const indices=filtered;
  return {length:to-from+1,at:i=>decodeMessage(rows[indices===null ? from+i : indices[from+i]])};
}
async function buildSnapshotWrap(rowsToUse, includeTime, includeDate){
  const wrap = document.createElement("div");
  wrap.className = "export-wrap";
  if(!includeTime){
    wrap.classList.add("snapshot-hide-time");
  }

  for(let idx=0;idx<rowsToUse.length;idx++){
    wrap.appendChild(createRowElement(rowsToUse.at(idx),includeTime,idx));
    if(idx%100===99) await yieldViewer();
  }

  if(includeDate){
    const metaRow = document.createElement("div");
    metaRow.className = "export-meta";
    const metaRight = document.createElement("div");
    metaRight.className = "export-meta-right";

    const dateIcon = document.createElement("span");
    dateIcon.textContent = "📅";
    const dateText = document.createElement("span");
    dateText.textContent = streamStart || "—";

    metaRight.appendChild(dateIcon);
    metaRight.appendChild(dateText);
    metaRow.appendChild(metaRight);
    wrap.appendChild(metaRow);
  }

  return wrap;
}

async function waitImages(root){
  const imgs=[...root.querySelectorAll("img")];
  await Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=img.onerror=res; })));
}

async function createSnapshotDataUrl(rowsToClone, includeTime, includeDate){
  const wrap = await buildSnapshotWrap(rowsToClone, includeTime, includeDate);
  document.body.appendChild(wrap);
  await new Promise(r=>setTimeout(r,50));
  await waitImages(wrap);

  let canvas;
  try{
    canvas = await html2canvas(wrap,{backgroundColor:"#18181f",useCORS:true,allowTaint:false,scale:2});
  }finally{
    if(wrap.parentNode){
      document.body.removeChild(wrap);
    }
  }

  return canvas.toDataURL("image/png");
}

const nextFrame = () => new Promise(requestAnimationFrame);

function updateSnapshotTimeButton(){
  if(!SNAPSHOT_TIME_BTN) return;
  SNAPSHOT_TIME_BTN.classList.toggle("is-active", SNAPSHOT_TIME_ENABLED);
  SNAPSHOT_TIME_BTN.classList.toggle("is-inactive", !SNAPSHOT_TIME_ENABLED);
  SNAPSHOT_TIME_BTN.setAttribute("aria-pressed", SNAPSHOT_TIME_ENABLED ? "true" : "false");
}

function updateSnapshotDateButton(){
  if(!SNAPSHOT_DATE_BTN) return;
  SNAPSHOT_DATE_BTN.classList.toggle("is-active", SNAPSHOT_DATE_ENABLED);
  SNAPSHOT_DATE_BTN.classList.toggle("is-inactive", !SNAPSHOT_DATE_ENABLED);
  SNAPSHOT_DATE_BTN.setAttribute("aria-pressed", SNAPSHOT_DATE_ENABLED ? "true" : "false");
}

async function rerenderSnapshotPreview(rowsToClone){
  const token = ++SNAPSHOT_RENDER_TOKEN;
  if(SNAPSHOT_PREVIEW_IMG){
    SNAPSHOT_PREVIEW_IMG.style.opacity = "0.55";
  }

  try{
    const url = await createSnapshotDataUrl(rowsToClone, SNAPSHOT_TIME_ENABLED, SNAPSHOT_DATE_ENABLED);
    if(token !== SNAPSHOT_RENDER_TOKEN) return;
    if(SNAPSHOT_PREVIEW_IMG){
      SNAPSHOT_PREVIEW_IMG.src = url;
      SNAPSHOT_PREVIEW_IMG.style.display = "block";

      const loader = SNAPSHOT_PREVIEW_IMG.closest(".snapshot-panel").querySelector(".snapshot-loader");
      if(loader) loader.remove();
      const panel = SNAPSHOT_PREVIEW_IMG?.closest(".snapshot-panel");
      const actions = panel?.querySelector(".snapshot-actions");
      if(actions) actions.classList.add("is-ready");
      SNAPSHOT_PREVIEW_IMG.style.opacity = "1";
    }
  }catch(err){
    if(token !== SNAPSHOT_RENDER_TOKEN) return;
    console.error("PNG render error:", err);
    if(SNAPSHOT_PREVIEW_IMG){
      SNAPSHOT_PREVIEW_IMG.style.opacity = "1";
    }
    const msg = String(err).toLowerCase();
    if(msg.includes("size")||msg.includes("dimension")||msg.includes("height")) alert("Слишком большой фрагмент. Браузер не смог создать изображение.");
    else alert("Ошибка создания изображения. Попробуйте уменьшить фрагмент.");
  }
}

function openSnapshotOverlay(rowsToClone){
  if(SNAPSHOT_OVERLAY){
    SNAPSHOT_OVERLAY.remove();
    SNAPSHOT_OVERLAY = null;
    SNAPSHOT_PREVIEW_IMG = null;
    SNAPSHOT_TIME_BTN = null;
    SNAPSHOT_DATE_BTN = null;
  }

  SNAPSHOT_TIME_ENABLED = SHOW_TIME;
  SNAPSHOT_DATE_ENABLED = false;

  const overlay = document.createElement("div");
  overlay.className = "snapshot-overlay";

  const panel = document.createElement("div");
  panel.className = "snapshot-panel";

  const img = document.createElement("img");
  img.className = "snapshot-preview";
  img.alt = "";

  const actions = document.createElement("div");
  actions.className = "snapshot-actions";
  actions.classList.remove("is-ready");

  const timeBtn = document.createElement("button");
  timeBtn.type = "button";
  timeBtn.className = "snapshot-toggle";
  timeBtn.textContent = "⏱️ Время";
  timeBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    SNAPSHOT_TIME_ENABLED = !SNAPSHOT_TIME_ENABLED;
    updateSnapshotTimeButton();
    await nextFrame();
    await rerenderSnapshotPreview(rowsToClone);
  });

  const dateBtn = document.createElement("button");
  dateBtn.type = "button";
  dateBtn.className = "snapshot-toggle";
  dateBtn.textContent = "📅 Дата";
  dateBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    SNAPSHOT_DATE_ENABLED = !SNAPSHOT_DATE_ENABLED;
    updateSnapshotDateButton();
    await nextFrame();
    await rerenderSnapshotPreview(rowsToClone);
  });

  SNAPSHOT_OVERLAY = overlay;
  SNAPSHOT_PREVIEW_IMG = img;
  SNAPSHOT_TIME_BTN = timeBtn;
  SNAPSHOT_DATE_BTN = dateBtn;
  updateSnapshotTimeButton();
  updateSnapshotDateButton();

  actions.appendChild(timeBtn);
  actions.appendChild(dateBtn);
  panel.appendChild(img);

  const loader = document.createElement("div");
  loader.className = "snapshot-loader";
  panel.appendChild(loader);

  panel.appendChild(actions);
  overlay.appendChild(panel);

  overlay.addEventListener("click", ()=>{
    overlay.remove();
    SNAPSHOT_OVERLAY = null;
    SNAPSHOT_PREVIEW_IMG = null;
    SNAPSHOT_TIME_BTN = null;
    SNAPSHOT_DATE_BTN = null;
    document.body.style.overflow = "";
  });

  panel.addEventListener("click", (e)=>e.stopPropagation());
  document.body.style.overflow = "hidden";
  document.body.appendChild(overlay);

  rerenderSnapshotPreview(rowsToClone);
}

elExportBtn.addEventListener("pointerup", async (e)=>{
  e.stopPropagation();
  e.preventDefault();


  await new Promise(r => setTimeout(r, 30)); // ← ДОБАВИТЬ

  rememberSelection();
  if(!selectionRange){alert("Выделите текст сообщений");return;}
  const from=Math.min(selectionRange.anchor.id,selectionRange.focus.id);
  const to=Math.max(selectionRange.anchor.id,selectionRange.focus.id);
  const rowsToClone=snapshotRows(from,to);
  selectionRange=null;projectedSelection=null;
  window.getSelection()?.removeAllRanges();
  openSnapshotOverlay(rowsToClone);
});

applyFilters();
</script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
