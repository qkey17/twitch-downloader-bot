<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Twitch Chat Viewer</title>
<style>
*{
  -webkit-tap-highlight-color: transparent;
}
*{
  -webkit-touch-callout: none;
}
button{
  -webkit-tap-highlight-color: transparent;
}
:root{
  --bg:#0f0f12;
  --panel:#15151b;
  --text:#e7e7ea;
  --muted:#a6a6b0;
  --border:#2a2a35;
  --control-h: 46px;
  --control-radius: 10px;
  --control-gap: 8px;

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;

  --controls-w:312px; /* ширина левого блока на десктопе */
  --chat-w:515px;     /* ширина блока сообщений на десктопе */
  --gap:16px;

}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.page{width:100%;display:flex;justify-content:center;padding:0}
.chat{
  width:100%;
  max-width:none;
  margin:0;
}

/* header / controls (mobile first) */
header{
  width:100%;
  max-width:none;
  background:#18181b;
  border-bottom:1px solid var(--border);
  padding:12px;
  box-sizing:border-box;
  position:sticky;
  top:0;
  z-index:50;
  border-radius:0;
  display:flex;
  flex-direction:column;
  gap: var(--control-gap);
  align-items:stretch;
  transition:padding .2s ease, gap .2s ease;
}
.meta{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin:0;
  min-width:0;
  height:100%;
}


.panel-top{
  display:grid;
  grid-template-columns:132px minmax(0,1fr);
  gap:10px;
  min-width:0;
  overflow:visible;
  transition:max-height .25s ease, opacity .2s ease, transform .25s ease, margin .2s ease;
  max-height:1000px;
  opacity:1;
  transform:none;
}

.panel-stats{
  display:flex;
  gap: var(--control-gap);
  align-items:center;
  justify-content:space-between;
  width:100%;
  min-width:0;
}

.panel-stats-main{
  display:flex;
  align-items:center;
  gap: var(--control-gap);
  min-width:0;
  overflow:hidden;
}

.panel-stats-separator{
  color:var(--muted);
  flex:0 0 auto;
}

.panel-stats .pill{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#streamDate{
  min-width:0;
}

.panel-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: var(--control-gap);
  width:100%;
  min-width:0;
}

.vod-heading{
  display:flex;
  align-items:flex-start;
  gap: var(--control-gap);
  min-width:0;
  width:100%;
}

.vod-channel{
  flex:0 1 auto;
  max-width:min(45%, 240px);
  font-size:16px;
  font-weight:700;
  line-height:1.2;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vod-separator{
  flex:0 0 auto;
  color:var(--muted);
  line-height:1.25;
  transform:translateY(0.05em);
}

.vod-title{
  flex:1 1 auto;
  min-width:0;
  font-size:17px;
  font-weight:400;
  line-height:1.3;
  color:var(--text);
  display:-webkit-box;
  -webkit-line-clamp:6;
  -webkit-box-orient:vertical;
  overflow:hidden;
  word-break:break-word;
}
.vod-title.is-truncated{
  overflow:hidden;
}

.vod-card{
  align-self:start;
  margin-bottom: var(--control-gap);
  border:1px solid rgba(145,70,255,0.25);
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.015));
  box-shadow:0 10px 30px rgba(0,0,0,.22);
  cursor:pointer;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.vod-card:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}
.vod-card:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:
    0 0 0 3px rgba(145,70,255,0.4),
    0 10px 24px rgba(0,0,0,.35);
}
.vod-card:focus-visible{
  outline:2px solid rgba(145,70,255,0.65);
  outline-offset:2px;
}
.vod-card-media{
  position:relative;
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#22222b,#15151b 55%, #0f0f12);
}
.vod-card-media img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.vod-card-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.06) 35%, rgba(0,0,0,.7) 100%);
}
.pill{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  color:var(--muted);
  font-size:13px;
}
.controls{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap: var(--control-gap);
  margin-top:8px;
  width:100%;
  min-width:0;
}
.controls #q{
  grid-column:1 / span 3;
  grid-row:1;
}

.controls #u{
  grid-column:4 / span 3;
  grid-row:1;
}


.controls-footer{
  grid-column:1 / span 6;
  grid-row:3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: var(--control-gap);
  width:100%;
  min-width:0;
}
.controls-footer .pill{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.controls input{
  min-width:0;
  height: var(--control-h);
  font-size:14px;
  padding:0 12px;
  border-radius: var(--control-radius);
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);

}
.button-toggle.active{
  background:var(--panel);
  border-color:var(--border);
}

.toggle-button{
  background:var(--panel);
  border:1px solid var(--border);
}

.toggle-button.is-active{
  background:var(--panel);
  border-color:var(--border);
}

.toggle-button.is-inactive{
  background:var(--panel);
  border-color:var(--border);
}

.meta-buttons{
  display:flex;
  gap: var(--control-gap);
  width:100%;
}

.panel-actions{
  width:100%;
}

.meta-buttons button{
  flex:1;
  height: var(--control-h);
  border-radius: var(--control-radius);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:14px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
  transition: background .15s ease, border-color .15s ease, transform .08s ease;
}

.meta-buttons .button-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

button:focus{
  outline:none;
}

button:focus-visible{
  outline:none;
}

button, .vod-card{
  user-select: none;
  -webkit-user-select: none;
}

/* активное состояние */
.meta-buttons button.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

.button-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

.button-toggle:active{
  transform:scale(0.96);
  background:#23232d; /* чуть темнее */
  border-color:#3a3a48;
}

/* неактивное */
.meta-buttons button.is-inactive{
  background:#15151b;
  border-color:var(--border);
  opacity:.7;
}

/* нажатие */
.meta-buttons button:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:0 0 0 3px rgba(145,70,255,0.35);
}

.meta-buttons button:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}

.snapshot-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.snapshot-panel{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  max-width:100%;
}

.snapshot-preview{
  max-width:min(100%, 1200px);
  max-height:min(80vh, 900px);
  border-radius:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
  display:block;
}

.snapshot-actions{
  display:flex;
  justify-content:flex-end;
  gap: var(--control-gap);
  width:100%;
  opacity:0;
  pointer-events:none;
  max-width: var(--controls-w);
}

.snapshot-actions.is-ready{
  opacity:1;
  pointer-events:auto;
}

/* Only the VOD overlay: let the rendered image determine the action width. */
.vod-preview-panel .snapshot-preview{
  max-width:min(calc(100vw - 40px), 1200px);
}
.vod-preview-panel .snapshot-actions{
  width:0;
  min-width:100%;
  max-width:none;
}

.vod-live-panel{align-items:center;}
.vod-live-panel .snapshot-actions{width:auto;min-width:0;}
.vod-live-panel > button{flex:none;min-height:44px;}
.vod-live-panel button:focus-visible{outline:2px solid #9146ff;outline-offset:2px;}
.vod-card[aria-disabled="true"]{cursor:default;}

.snapshot-toggle{
  height: var(--control-h);
  border-radius: var(--control-radius);
  padding:0 14px;
  font-size:14px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;

  transition: background .15s ease, border-color .15s ease, transform .08s ease;

  flex:1;
}

.snapshot-loader{
  width:60px;
  height:60px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#fff;
  animation:spin 1s linear infinite;
  align-self:center;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* активное */
.snapshot-toggle.is-active{
  background:#2a2a35;
  border-color:#3a3a48;
}

/* неактивное */
.snapshot-toggle.is-inactive{
  opacity:.7;
}

/* нажатие */
.snapshot-toggle:active{
  transform:scale(0.96);
  border-color:rgba(145,70,255,0.9);
  box-shadow:0 0 0 3px rgba(145,70,255,0.35);
}

/* hover (не ломает active) */
.snapshot-toggle:hover{
  transform:translateY(-1px);
  border-color:rgba(145,70,255,0.8);
  box-shadow:
    0 0 0 2px rgba(145,70,255,0.35),
    0 14px 34px rgba(0,0,0,.28);
}

/* Measured rows, not the browser's fallback anchor, own document positioning. */
html{overflow-anchor:none;}

/* message list */
#list{
  overflow-anchor:none; /* Measured windows own scroll anchoring. */
  width:100%;
  max-width:390px;
  margin-left:auto;
  margin-right:auto;
  background:#1f1f23;
  min-height:100vh;
  padding-bottom:40px;
  margin-top:0;
  border-radius:0;
  overflow-x:hidden;
}

/* row */
.row{
  display:block;
  padding:6px 12px;
  line-height:1.4;
  overflow-wrap:anywhere;
}
.time{
  color:#adadb8;
  white-space:nowrap;
  margin-right:6px;
}
.user{
  display:inline;
  font-weight:600;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  min-width:0;
  max-width:100%;
}

.colon{
  display:inline;
  color:var(--text);
  margin-right:6px;          /* пространство между ':' и началом сообщения */
  white-space:nowrap;
}
.msg{
  display:inline;
  flex:0 1 auto;
  color:var(--text);
  overflow-wrap:anywhere;
  word-break:break-word;
  min-width:0;
}
.badges{
  display:inline-flex;
  align-items:center;
  gap:2px;
  margin-right:4px;
  vertical-align:middle;
  flex:0 0 auto;
}
.badge{
  width:18px;
  height:18px;
  display:inline-block;
  vertical-align:middle;
  object-fit:contain;
  image-rendering:auto;
}

.emote{
  vertical-align: -0.2em;
  margin: 0 2px;
}

.panel-stats img{
  height: 1em;
}

#mobileChannel img{
  height: 1.3em;
  width: 1.3em;
  object-fit: contain;
}

#mobileChannel{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-start;
}

#mobileChannel span{
  margin-left: 2px;
}

/* export helper (unchanged) */
.export-wrap{
  position:fixed;
  left:-99999px;
  top:0;
  width:390px;
  background:#18181f;

  padding:16px;           /* ← одинаково сверху и снизу */
  display:inline-block;

  box-sizing:border-box;  /* ← важно */

  overflow:hidden;
}
.export-meta{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;color:#b9b9c6}

/* ===== Desktop layout ===== */
@media (min-width: 901px){
  .page{padding:24px}
  .chat{max-width: calc(var(--controls-w) + var(--chat-w) + var(--gap)); display:flex; gap:var(--gap); align-items:flex-start}

  /* left column becomes fixed-ish via sticky */
  header{
    width:var(--controls-w);
    max-width:none;
    flex:0 0 var(--controls-w);
    position:sticky;
    top:24px; /* offset from viewport top */
    border-radius:14px;
    padding:20px;
    height:fit-content;
  }

  /* make controls vertical and full width of left column */
  .controls{
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    margin-top:2px;
    align-items:stretch;
  }

  .controls input{
    width:100%;
    height: var(--control-h);
    font-size:14px;
    padding:0 12px;
    flex:0 0 auto;
  }

  .panel-stats{
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto;
    row-gap: 4px;
  }

  .panel-stats-channel{
    width: 100%;
    grid-column: 1 / -1; /* вся строка */
  }

  #stat{
    grid-column: 1 / -1;
    justify-self: start;
  }
  .panel-stats > .pill:not(.panel-stats-channel){
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
    overflow-wrap:anywhere;
  }
  /* messages column */
  #list{
    width:var(--chat-w);
    max-width:var(--chat-w);
    flex:0 0 var(--chat-w);
    border-radius:14px;
    min-height:calc(100vh - 48px);
    margin-top:0; /* header is in left column, not above messages */
  }

  /* center whole layout horizontally */
  .page{justify-content:center}
}

/* small refinements for very narrow phones (so content not glued to edges) */
@media (max-width:420px){
  .chat{padding:0 8px}
  header{padding:10px;border-radius:12px}
  #list{margin-top:0;border-radius:0}
}



@media (max-width: 900px){

  header .panel-top{order:0;}
  header .panel-stats{order:1;}
  header .live-capture-warning{order:2;}
  header .controls{order:3;}
  header .panel-actions{order:4;}
  header.is-compact .live-capture-warning{display:none;}

  header.is-expanded .panel-stats{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:6px;
    align-items:start;
  }
  header.is-expanded #mobileChannel{
    display:block;
    grid-column:1 / -1;
    white-space:normal;
    overflow:visible;
    overflow-wrap:anywhere;
  }
  header.is-expanded .panel-stats > .pill:not(.panel-stats-channel){
    white-space:normal;
    overflow:visible;
    overflow-wrap:anywhere;
  }
  header.is-expanded #stat{max-width:100%;justify-self:end;text-align:right;}
  .chat:has(header.is-expanded) #list{padding-top:var(--mobile-expanded-height,145px);}

  #list{
    padding-top: 145px;
  }

  header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:auto;
    padding:10px 12px 12px;
    background:#18181b;
    box-shadow:0 18px 40px rgba(0,0,0,.38);
    overflow:visible;
    z-index:80;
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    align-items:stretch;
    transition:transform .24s ease, box-shadow .2s ease;
    will-change:transform;
    touch-action: none;
    padding-bottom: 32px;
  }

    header::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);

    width:46px;
    height:4px;

    border-radius:999px;
    background:rgba(255,255,255,.18);
  }

  header.is-expanded{
    transform:translateY(0);
  }

  header.is-compact .panel-top,
  header.is-compact .panel-stats{
    opacity:0;
    transform:translateY(-8px);
    pointer-events:none;
  }

  header.is-compact .controls{
  margin-top: calc(var(--control-gap) * 1.5);
}

  header.is-expanded .panel-top,
  header.is-expanded .panel-stats{
    opacity:1;
    transform:none;
  }

  .panel-top{
    display:grid;
    grid-template-columns:132px minmax(0,1fr);
    gap:14px;
    min-width:0;
    transition:opacity .2s ease, transform .24s ease;
  }

  .panel-stats{
    display:flex;
    gap: row-gap:6px;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-width:0;
    transition:opacity .2s ease, transform .24s ease;
  }

  .panel-stats .pill{
    min-width:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .panel-stats-channel{
    flex:1 1 auto;
  }

  .vod-card{
    margin:0;
  }

  .meta{
    margin:0;
  }

  .vod-title{
    -webkit-line-clamp:4;
    font-size:14px;
  }

  .vod-channel{
    font-size:15px;
    max-width:none;
  }

  .controls{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
    margin-top:0;
    min-width:0;
    width:100%;
  }

  .controls input{
    width:100%;
    min-width:0;
    height: var(--control-h);
    font-size:14px;
    padding:0 12px;
  }

  .panel-actions{
    display:flex;
    flex-direction:column;
    gap: var(--control-gap);
    width:100%;
  }

  .meta-buttons{
    display:flex;
    gap: var(--control-gap);
    width:100%;
    min-width:0;
  }

  .meta-buttons button{
    flex:1 1 0;
    height: var(--control-h);
    font-size:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.24);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  header.is-dragging{
  transition:none !important;
  }

}
.live-capture-warning{margin:8px 0;padding:8px 10px;border:1px solid #a74444;border-radius:8px;background:rgba(180,45,45,.12);font-size:13px;line-height:1.4;overflow-wrap:anywhere;}
.live-capture-warning[hidden]{display:none;}
</style>

</head>
<body>
<div class="page">
  <div class="chat">

    <header>
      <div class="panel-top">
        <div class="vod-card" id="vodCard" tabindex="0" role="button" aria-label="Открыть VOD">
          <div class="vod-card-media">
            <img id="vodPreviewImg" alt="" loading="eager" decoding="async" />
            <div class="vod-card-shade"></div>
          </div>
        </div>

        <div class="meta">
          <div class="vod-heading">
            <span id="title" class="vod-title">—</span>
          </div>
        </div>
      </div>

      <div class="panel-stats">

        <span class="pill panel-stats-channel" id="mobileChannel">—</span>

        <span class="pill">
          <span id="streamDate">—</span>
        </span>

        <span class="pill" id="stat">—</span>

      </div>

      <div class="controls">
        <input id="q" placeholder="Поиск по сообщениям…"/>
        <input id="u" placeholder="Фильтр по нику…"/>
      </div>

      <div class="panel-actions">
  <div class="meta-buttons">
    <button id="exportBtn" class="button-toggle is-active">📸 Снимок</button>
    <button id="toggleTime" class="toggle-button is-active" aria-pressed="true">⏱️ Время</button>
  </div>
</div>
      <div id="liveCaptureWarning" class="live-capture-warning" role="note" hidden></div>
    </header>

    <div id="list"></div>

  </div>
</div>

<script id="chat-data" type="application/json">{{CHAT_DATA_JSON}}</script>

<script>
/* DOM is shared by two layouts:
   desktop = sticky sidebar, mobile = 2-column header grid. */


const DATA = JSON.parse(document.getElementById("chat-data").textContent || "{}");
const meta = DATA.meta || {};
if(meta.captured_during_live === true){
  const warning = document.getElementById('liveCaptureWarning');

const rows = DATA.rows || [];
const COMPACT_DATA = DATA.format === 'tcd-compact-v1';
// No rows.map(decode): data stays compact for its entire lifetime. Search reads
// scalar fields directly; only rendered/exported messages need temporary objects.
function messageUser(record){
  if(!COMPACT_DATA) return record.user;
  return (typeof record[1]==='number' ? DATA.users[record[1]] : record[1])[0];
}
function messageText(record){return COMPACT_DATA ? record[2] : record.text;}
function decodeMessage(record){
  if(!COMPACT_DATA) return record;
  const user=typeof record[1]==='number' ? DATA.users[record[1]] : record[1];
  const badges=typeof record[4]==='number' ? DATA.badges[record[4]] : record[4][0];
  const mask=record.length>5 ? record[5] : 63;
  if(mask===63 && record.length<7) return {t:record[0],user:user[0],text:record[2],fragments:record[3],color:user[1],badges};
  const values=[record[0],user[0],record[2],record[3],user[1],badges];
  const keys=['t','user','text','fragments','color','badges'];
  const result=record.length>6 ? {...record[6]} : {};
  for(let i=0;i<keys.length;i++) if(mask & (1<<i)) result[keys[i]]=values[i];
  return result;
}

function fitVodTitle(){
  if(!elTitle) return;
  const maxLines = 3;
  const minFont = 12;
  const maxFont = 15;

  elTitle.style.fontSize = `${maxFont}px`;
  elTitle.classList.remove("is-truncated");

  const cs = getComputedStyle(elTitle);
  const lineHeight = parseFloat(cs.lineHeight) || (parseFloat(cs.fontSize) * 1.22) || 18;
  const maxHeight = lineHeight * maxLines + 1;

  let size = maxFont;
  while(size > minFont && elTitle.scrollHeight > maxHeight){
    size -= 0.5;
    elTitle.style.fontSize = `${size}px`;
  }

  if(elTitle.scrollHeight > maxHeight){
    elTitle.classList.add("is-truncated");
  }
}

const MOBILE_PANEL_EXPANDED = 260;
const MOBILE_PANEL_VISIBLE = 140;
const MOBILE_PANEL_OFFSET = MOBILE_PANEL_VISIBLE - MOBILE_PANEL_EXPANDED; // negative
let PANEL_DRAG = null;
let PANEL_OFFSET = MOBILE_MQ.matches ? MOBILE_PANEL_OFFSET : 0;

function clampPanelOffset(v){
  return Math.max(MOBILE_PANEL_OFFSET, Math.min(0, v));
}

function applyPanelOffset(value, animate=true){
  PANEL_OFFSET = clampPanelOffset(value);
  if(!MOBILE_MQ.matches){
    elHeader.style.transform = "";
    return;
  }
  elHeader.style.transition = animate ? "transform .24s ease, box-shadow .2s ease" : "none";
  elHeader.style.transform = `translateY(${PANEL_OFFSET}px)`;
}

function syncPanelState(expanded, animate=true){
  PANEL_EXPANDED = !!expanded;
  if(!elHeader) return;
  elHeader.classList.toggle("is-expanded", PANEL_EXPANDED);
  elHeader.classList.toggle("is-compact", !PANEL_EXPANDED);

  if(MOBILE_MQ.matches){
    applyPanelOffset(PANEL_EXPANDED ? 0 : MOBILE_PANEL_OFFSET, animate);
  }else{
    elHeader.style.transform = "";
  }
}

syncPanelState(PANEL_EXPANDED, false);

if("ResizeObserver" in window){
  new ResizeObserver(()=>{

  }).observe(elHeader);

elHeader.addEventListener("pointerdown", (e)=>{
  if(!MOBILE_MQ.matches) return;

  const isInput = e.target.closest("input");

  PANEL_DRAG = {
    pointerId: e.pointerId,
    startY: e.clientY,
    startOffset: PANEL_OFFSET,
    fromInput: !!isInput,
    moved: false
  };

  elHeader.style.transition = "none";
  elHeader.classList.add("is-dragging");
});

elHeader.addEventListener("pointermove", (e)=>{
  if(!PANEL_DRAG || e.pointerId !== PANEL_DRAG.pointerId) return;

  const dy = e.clientY - PANEL_DRAG.startY;

  if(Math.abs(dy) < 5) return;

  // ← ДОБАВЬ ЭТО
  if(!elHeader.hasPointerCapture(e.pointerId)){
    elHeader.setPointerCapture(e.pointerId);
  }

  e.preventDefault();

  applyPanelOffset(
    PANEL_DRAG.startOffset + dy,
    false
  );
});

elHeader.addEventListener("pointerup", (e)=>{
  if(!PANEL_DRAG || e.pointerId !== PANEL_DRAG.pointerId) return;

  elHeader.releasePointerCapture(e.pointerId);

  const threshold = MOBILE_PANEL_OFFSET * 0.6;
  const shouldExpand = PANEL_OFFSET > threshold;

  PANEL_DRAG = null;
  elHeader.classList.remove("is-dragging");

  syncPanelState(shouldExpand, true);
});

elHeader.addEventListener("pointercancel", (e)=>{
  if(!PANEL_DRAG || e.pointerId !== PANEL_DRAG.pointerId) return;

  elHeader.releasePointerCapture(e.pointerId);

  PANEL_DRAG = null;
  elHeader.classList.remove("is-dragging");
});

let TOUCH_DRAG = null;

elHeader.addEventListener("touchstart", (e)=>{
  if(!MOBILE_MQ.matches) return;

  const t = e.touches[0];

  TOUCH_DRAG = {
    startY: t.clientY,
    startOffset: PANEL_OFFSET,
    fromInput: !!e.target.closest("input"),
    moved: false
  };
}, { passive: true });

elHeader.addEventListener("touchmove", (e)=>{
  if(!TOUCH_DRAG) return;

  const t = e.touches[0];
  const dy = t.clientY - TOUCH_DRAG.startY;

if(Math.abs(dy) < 5) return;

if(TOUCH_DRAG.fromInput && !TOUCH_DRAG.moved){
  TOUCH_DRAG.moved = true;
}

  e.preventDefault(); // ← КЛЮЧЕВОЕ

  applyPanelOffset(
    TOUCH_DRAG.startOffset + dy,
    false
  );
}, { passive: false });

elHeader.addEventListener("touchend", ()=>{
  if(!TOUCH_DRAG) return;

  const threshold = MOBILE_PANEL_OFFSET * 0.6;
  const shouldExpand = PANEL_OFFSET > threshold;

  TOUCH_DRAG = null;

});

elHeader.addEventListener("touchcancel", ()=>{
  TOUCH_DRAG = null;
});

function safeVodUrl(value){
  if(typeof value !== "string" || value.length > 2048) return "";
  try{
    const url = new URL(value);
    if(url.protocol !== "https:" || !["www.twitch.tv", "twitch.tv"].includes(url.hostname)
       || url.username || url.password || url.port || !/^\/videos\/[1-9][0-9]{0,19}\/?$/.test(url.pathname)) return "";
    return url.href;
  }catch(e){ return ""; }
}
const livePreview = meta.captured_during_live === true;
const vodLink = safeVodUrl(meta.vod_url);

function openVodOverlay(){
  if(livePreview ? !vodLink : (!meta.thumbnail_full_url && !meta.thumbnail_preview_url)) return;

  const token = ++vodOverlayToken;
  if(vodOverlay){
    vodOverlay.remove();
  }

  const overlay = document.createElement("div");
  overlay.className = "snapshot-overlay";
  vodOverlay = overlay;

  const panel = document.createElement("div");
  panel.className = "snapshot-panel vod-preview-panel" + (livePreview ? " vod-live-panel" : "");
  if(livePreview){
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", "Открыть VOD");
  }

  // ПРЕВЬЮ
  const preview = livePreview ? null : document.createElement("img");
  if(preview){ preview.className = "snapshot-preview"; preview.alt = ""; }
  if(!livePreview) panel.appendChild(preview);

  // ЛОАДЕР
  const loader = document.createElement("div");
  loader.className = "snapshot-loader";
  if(!livePreview) panel.appendChild(loader);

  // ACTIONS
  const actions = document.createElement("div");
  actions.className = "snapshot-actions";

  const linkBtn = document.createElement("button");
  linkBtn.className = "snapshot-toggle is-active";

  linkBtn.textContent = "🔗 Ссылка на VOD";

  linkBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    if(vodLink){
      window.open(vodLink,"_blank", "noopener,noreferrer");
    }
  });

  if(vodLink) actions.appendChild(linkBtn);
  panel.appendChild(actions);
  overlay.appendChild(panel);

  function closeOverlay(){
    overlay.remove();
    if(vodOverlay === overlay){
      vodOverlay = null;
      vodOverlayToken++;
    }
    document.body.style.overflow = "";
    if(livePreview) elVodCard.focus();
  }
  overlay.addEventListener("click", closeOverlay);
  if(livePreview){
    const closeBtn = document.createElement("button");
    closeBtn.className = "snapshot-toggle";
    closeBtn.textContent = "Закрыть";
    closeBtn.addEventListener("click", closeOverlay);
    panel.appendChild(closeBtn);
    overlay.addEventListener("keydown", (e)=>{
      if(e.key === "Escape"){ e.preventDefault(); closeOverlay(); }
      if(e.key === "Tab"){
        e.preventDefault();
        (document.activeElement === linkBtn ? closeBtn : linkBtn).focus();
      }
    });
  }

  panel.addEventListener("click", (e)=>e.stopPropagation());

  document.body.style.overflow = "hidden";
  document.body.appendChild(overlay);

  if(livePreview){
    actions.classList.add("is-ready");
    linkBtn.focus();
    return;
  }

  // ЗАГРУЗКА КАРТИНКИ
  const full = new Image();
  full.onload = ()=>{
    if(token !== vodOverlayToken || vodOverlay !== overlay || !overlay.isConnected) return;
    preview.src = full.src;
    loader.remove();
    actions.classList.add("is-ready");
  };
  full.onerror = ()=>{
    if(token !== vodOverlayToken || vodOverlay !== overlay || !overlay.isConnected) return;
    loader.classList.remove("snapshot-loader");
    loader.textContent = "Не удалось загрузить изображение";
    actions.classList.add("is-ready");
  };
  full.src = meta.thumbnail_full_url || meta.thumbnail_preview_url;
}

function fmtStreamStart(iso){
  if(typeof iso !== "string") return null;
  iso = iso.trim();
  const parts = /^(\d{4})-(\d{2})-(\d{2})(?:[Tt ](\d{2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?(Z|[+-]\d{2}:?\d{2})?$/.exec(iso);
  if(!parts) return null;
  const [, year, month, day, hour="00", minute="00", second="00", zone="Z"] = parts;
  const y=Number(year), m=Number(month), d=Number(day);
  const leap=y%4===0 && (y%100!==0 || y%400===0);
  const days=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];
  if(y<1 || m<1 || m>12 || d<1 || d>days[m-1] || Number(hour)>23 || Number(minute)>59 || Number(second)>59) return null;
  const date = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}${zone}`);
  if(Number.isNaN(date.getTime())) return null;
  const months=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  return `${date.getUTCDate()} ${months[date.getUTCMonth()]} ${String(date.getUTCFullYear()).padStart(4,"0")} ${String(date.getUTCHours()).padStart(2,"0")}:${String(date.getUTCMinutes()).padStart(2,"0")} UTC`;
}

function colorForUser(name){
  const u = String(name || "");
  if(!u) return "#adadb8";
  const first = u.charCodeAt(0) || 0;
  const last = u.charCodeAt(u.length - 1) || 0;
  return DEFAULT_COLORS[(first + last) % DEFAULT_COLORS.length];
}
function renderBadges(el, badges){
  const document=el.ownerDocument || globalThis.document;
  if(!Array.isArray(badges) || badges.length === 0) return false;

  let rendered = false;
  const wrap = document.createElement("span");
  wrap.className = "badges";

  for(const badge of badges){
    if(!badge || typeof badge !== "object") continue;

    const setId = badge.set_id || badge.setID;
    const version = badge.version;

    const key = `${String(setId).toLowerCase()}/${String(version)}`;
    const src = BADGE_IMAGES[key];

    if(!src) continue;

    const img = document.createElement("img");
    img.className = "badge";
    img.src = src;
    img.alt = key;

    wrap.appendChild(img);
    rendered = true;
  }

  if(rendered){
    el.appendChild(wrap);
  }

  return rendered;
}


async function fetch7tvEmotes(channelId){
  if(!channelId) return new Map();
  try{
    const r = await fetch(`https://7tv.io/v3/users/twitch/${channelId}`);
    if(!r.ok) return new Map();
    const json = await r.json();
    const emotes = json?.emote_set?.emotes || [];
    const map = new Map();
    for(const e of emotes){
      const name = e?.name;
      const host = e?.data?.host;
      if(!name||!host) continue;
      const files = host.files || [];
      const file = files.find(f=>f.name==="1x.webp")||files.find(f=>String(f.name).endsWith(".webp"))||files[0];
      if(!file) continue;
      map.set(name,`https:${host.url}/${file.name}`);
    }
    return map;
  }catch(e){ return new Map(); }
}

function catalogEmoteUrl(catalog, name){
  // Message tokens can match Object.prototype names, even in an empty catalog.
  if(!Object.prototype.hasOwnProperty.call(catalog, name)) return null;
  const value = catalog[name];
  return typeof value === "string" && value.trim() ? value : null;
}

function renderTextWithEmotes(el,text,emotes){
  const document=el.ownerDocument || globalThis.document;
  const parts = String(text||"").split(/(\s+)/);
  for(const p of parts){
  const clean = p.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'');
    const src = catalogEmoteUrl(LOCAL_EMOTES, clean) || catalogEmoteUrl(CDN_EMOTES, clean);
    if(src){
      const img = document.createElement("img");
      img.src = src; img.crossOrigin="anonymous"; img.alt=p; img.title=p; img.className="emote"; el.appendChild(img);
    } else if(emotes.has(clean)){
      const img = document.createElement("img");
      img.src = emotes.get(clean); img.crossOrigin="anonymous"; img.alt=p; img.title=p; img.className="emote"; el.appendChild(img);
    } else {
      el.appendChild(document.createTextNode(p));
    }
  }
}

function renderFragmentsWithEmotes(el, fragments, emotes){
  const document=el.ownerDocument || globalThis.document;
  if(!Array.isArray(fragments) || fragments.length === 0){
    return false;
  }

  let renderedAny = false;
  for(const fragment of fragments){
    if(!fragment || typeof fragment !== "object") continue;

    const rawText = String(fragment.text || "");
    const cleanText = rawText
      .replace(/[\u200B-\u200D\uFEFF]/g,'')
      .replace(/[\r\n\t]/g,'')
      .trim();
    const emoteId = fragment.emoteID || (fragment.emote && (fragment.emote.emoteID || fragment.emote.id)) || null;

    if(emoteId){
      const img = document.createElement("img");
      img.src = `https://static-cdn.jtvnw.net/emoticons/v2/${emoteId}/default/dark/1.0`;
      img.crossOrigin="anonymous";
      img.alt = rawText || emoteId;
      img.title = rawText || emoteId;
      img.className="emote";
      el.appendChild(img);
      renderedAny = true;
      continue;
    }

    const src = cleanText && (catalogEmoteUrl(LOCAL_EMOTES, cleanText) || catalogEmoteUrl(CDN_EMOTES, cleanText));
    if(src){
      const img = document.createElement("img");
      img.src = src; img.crossOrigin="anonymous"; img.alt=rawText; img.title=rawText; img.className="emote"; el.appendChild(img);
      renderedAny = true;
      continue;
    }

    if(rawText){
      renderTextWithEmotes(el, rawText, emotes);
      renderedAny = true;
    }
  }

  return renderedAny;
}

const CHUNK = 800;
function createRowElement(r, includeTime, rowIndex, ownerDocument=document){
  const document=ownerDocument;
  const rowEl = document.createElement("div");
  if(rowIndex !== undefined && rowIndex !== null){
    rowEl.dataset.id = String(rowIndex);
  }
  rowEl.className = "row";
  const tRaw = (r.t || "00:00:00");
  const tNorm = String(tRaw).replace(/\s*:\s*/g,":");
  if(includeTime){
    const timeEl = document.createElement("span");
    timeEl.className = "time";
    timeEl.textContent = tNorm;
    rowEl.appendChild(timeEl);
  }

  const nameWrap = document.createElement("span");
  renderBadges(nameWrap, r.badges || []);

  const userEl = document.createElement("span");
  userEl.className = "user";
  userEl.textContent = r.user || "—";
  userEl.style.color = String(r.color || colorForUser(r.user)).trim();
  nameWrap.appendChild(userEl);

  const colonEl = document.createElement("span");
  colonEl.className = "colon";
  colonEl.textContent = ":";
  const msgEl = document.createElement("span");
  msgEl.className = "msg";
  if(!renderFragmentsWithEmotes(msgEl, r.fragments || [], EMOTES)){
    renderTextWithEmotes(msgEl, r.text || "", EMOTES);
  }
  nameWrap.appendChild(colonEl);
  rowEl.appendChild(nameWrap);
  rowEl.appendChild(msgEl);
  return rowEl;
}


/* Only indices are filtered; the original payload is never copied or decorated.
   Block heights are measured, not assumed uniform. Unknown blocks use a running
   estimate until visited; every visited block keeps its exact height. */
let filtered = null;
let FILTER_TOKEN = 0;
let EMOTES = new Map();
let EMOTES_READY = false;
const WINDOW_BLOCKS = 3;
const blockNodes = new Map();
let heights = [];
let averageHeight = 40;
let windowStart = 0, windowEnd = 0, windowToken = 0;
let windowBusy = false, windowFrame = 0;
let stableAnchor = null;
let resizeAnchor = null, resizeTimer = null;
let scrollIntent = 0;
for(const type of ['wheel','touchmove','pointerdown','keydown']){
  window.addEventListener(type,()=>{scrollIntent++;resizeAnchor=null;clearTimeout(resizeTimer);},{passive:true,capture:true});
}
let selectionRange = null, projectedSelection = null, selectionGesture = null;
const yieldViewer = () => globalThis.scheduler?.yield ? scheduler.yield() : new Promise(resolve=>setTimeout(resolve,0));
const rowCount = () => filtered === null ? rows.length : filtered.length;
const rowAt = i => decodeMessage(rows[filtered === null ? i : filtered[i]]);
const blockCount = () => Math.ceil(rowCount()/CHUNK);
const blockLength = b => Math.min(CHUNK,rowCount()-b*CHUNK);
const topSpace = document.createElement('div');
const bottomSpace = document.createElement('div');
for(const node of [topSpace,bottomSpace]){
  node.setAttribute('aria-hidden','true');
  node.style.pointerEvents='none';
}
elList.append(topSpace,bottomSpace);

function heightBefore(block){
  let total=0;
  for(let b=0;b<block;b++) total+=heights[b] ?? blockLength(b)*averageHeight;
  return total;
}
function updateSpaces(){
  topSpace.style.height=heightBefore(windowStart)+'px';
  bottomSpace.style.height=(heightBefore(blockCount())-heightBefore(windowEnd))+'px';
}
function visibleAnchor(){
  for(const node of blockNodes.values()){
    if(node.getBoundingClientRect().bottom<=0) continue;
    for(const row of node.children){
      const rect=row.getBoundingClientRect();
      if(rect.top>=innerHeight) return null;
      if(rect.bottom>0) return {id:Number(row.dataset.id),top:rect.top};
    }
  }
  return null;
}
function restoreAnchor(anchor){
  if(!anchor) return;
  const node=elList.querySelector(`.row[data-id="${anchor.id}"]`);
  if(node) window.scrollBy(0,node.getBoundingClientRect().top-anchor.top);
}
function measureBlocks(anchor=resizeAnchor || stableAnchor || visibleAnchor()){
  let total=0,count=0;
  for(const [b,node] of blockNodes){
    if(node.dataset.pending) continue;
    heights[b]=node.getBoundingClientRect().height;
    total+=heights[b];count+=blockLength(b);
  }
  if(count) averageHeight=total/count;
  updateSpaces();restoreAnchor(anchor);stableAnchor=visibleAnchor();
}
const blockObserver=new ResizeObserver(()=>{
  if(!windowBusy) {measureBlocks();scheduleWindow();}
});
function targetBlock(){
  const start=elList.getBoundingClientRect().top+window.scrollY+parseFloat(getComputedStyle(elList).paddingTop);
  const y=Math.max(0,window.scrollY-start);
  let b=0;
  while(b<blockCount()-1 && heightBefore(b+1)<=y) b++;
  return b;
}
async function showWindow(block, force=false){
  const count=blockCount();
  const start=Math.max(0,Math.min(block-1,count-WINDOW_BLOCKS));
  const end=Math.min(count,start+WINDOW_BLOCKS);
  if(!force && start===windowStart && end===windowEnd) return;
  const token=++windowToken;
  windowBusy=true;
  rememberSelection();
  const anchor=visibleAnchor(),intent=scrollIntent;
  for(const [b,node] of blockNodes){
    if(force || b<start || b>=end){blockObserver.unobserve(node);node.remove();blockNodes.delete(b);}
  }
  windowStart=start;windowEnd=end;updateSpaces();
  // Reserve space before yielding. The browser must never clamp scrollY while
  // a replacement block is being built (especially near the end of the chat).
  for(let b=start;b<end;b++){
    if(blockNodes.has(b)) continue;
    const placeholder=document.createElement('div');placeholder.dataset.pending='true';
    placeholder.style.height=(heights[b] ?? blockLength(b)*averageHeight)+'px';
    const next=[...blockNodes].filter(([key])=>key>b).sort((a,b)=>a[0]-b[0])[0]?.[1] || bottomSpace;
    elList.insertBefore(placeholder,next);blockNodes.set(b,placeholder);
  }
  for(let b=start;b<end;b++){
    if(!blockNodes.get(b).dataset.pending) continue;
    const node=document.createElement('div');
    let early=false;
    const reserved=heights[b] ?? blockLength(b)*averageHeight;
    // Build detached in small tasks, so typing/scrolling can cancel old work.
    for(let i=b*CHUNK;i<Math.min((b+1)*CHUNK,rowCount());){
      const until=Math.min(i+100,(b+1)*CHUNK,rowCount());
      for(;i<until;i++) node.appendChild(createRowElement(rowAt(i),SHOW_TIME,i));
      if(b===0 && i===100 && start===0){
        node.style.minHeight=reserved+'px';
        blockNodes.get(b).replaceWith(node);blockNodes.set(b,node);early=true;
        // A real frame lets the first messages paint before filling 2400 rows.
        await new Promise(requestAnimationFrame);
      }else await yieldViewer();
      if(token!==windowToken) return;
    }
    if(!early){blockNodes.get(b).replaceWith(node);blockNodes.set(b,node);}
    node.style.minHeight='';
    // Keep map traversal in document order even when restoring earlier blocks.
    const ordered=[...blockNodes].sort((a,b)=>a[0]-b[0]);blockNodes.clear();
    for(const entry of ordered) blockNodes.set(...entry);
    heights[b]=node.getBoundingClientRect().height;
    updateSpaces();if(intent===scrollIntent) restoreAnchor(anchor);
    blockObserver.observe(node);
  }
  windowBusy=false;
  const retained=anchor && elList.querySelector(`.row[data-id="${anchor.id}"]`) ? anchor : visibleAnchor();
  measureBlocks(intent===scrollIntent ? retained : visibleAnchor());projectSelection();scheduleWindow();
}
function scheduleWindow(){
  if(windowFrame) return;
  windowFrame=requestAnimationFrame(()=>{
    windowFrame=0;
    if(!windowBusy && !resizeAnchor) showWindow(targetBlock());
  });
}
async function ensureEmotesLoaded(){
  if(EMOTES_READY) return;
  EMOTES_READY=true;
  if(MODE!=="online" || !TWITCH_CHANNEL_ID) return;
  EMOTES=await fetch7tvEmotes(TWITCH_CHANNEL_ID);
  const block=targetBlock();heights=[];
  await showWindow(block,true);
}
function matches(r,q,u){
  return (!u || String(messageUser(r)||'').toLowerCase().includes(u)) &&
         (!q || String(messageText(r)||'').toLowerCase().includes(q));
}
async function applyFilters(){
  const token=++FILTER_TOKEN;
  const q=(elQ.value||'').trim().toLowerCase();
  const u=(elU.value||'').trim().toLowerCase();
  let result=null;
  if(q || u){
    const indices=new Uint32Array(rows.length);
    let found=0;
    for(let i=0;i<rows.length;){
      const deadline=performance.now()+6;
      do {if(matches(rows[i],q,u)) indices[found++]=i; i++;}
      while(i<rows.length && performance.now()<deadline);
      await yieldViewer();
      if(token!==FILTER_TOKEN) return;
    }
    result=indices.subarray(0,found);
  }
  filtered=result;stableAnchor=null;selectionRange=null;projectedSelection=null;selectionGesture=null;
  window.getSelection()?.removeAllRanges();
  heights=[];windowStart=windowEnd=0;
  elStat.textContent=`💬 ${rowCount()} / ${rows.length}`;
  window.scrollTo(0,0);
  await showWindow(0,true);
  ensureEmotesLoaded();
}
document.addEventListener('scroll',()=>{if(!windowBusy && !resizeAnchor) stableAnchor=visibleAnchor();scheduleWindow();},{passive:true});
let listWidth=elList.clientWidth;
let listPadding=getComputedStyle(elList).paddingTop;
const listObserver=new ResizeObserver(()=>{
  const padding=getComputedStyle(elList).paddingTop;
  if(elList.clientWidth===listWidth && padding===listPadding) return;
  if(elList.clientWidth!==listWidth) heights=[];
  listWidth=elList.clientWidth;listPadding=padding;
  if(!windowBusy) measureBlocks(resizeAnchor || stableAnchor);
  scheduleWindow();
});
listObserver.observe(elList,{box:'border-box'});
window.addEventListener('resize',()=>{
  // Width, wrapping and the mobile header settle in different observer turns.
  // Keep one logical anchor through the entire resize, not temporary positions.
  if(!resizeAnchor && window.scrollY>0) resizeAnchor=stableAnchor;
  clearTimeout(resizeTimer);
  if(!windowBusy) measureBlocks(resizeAnchor || visibleAnchor());
  resizeTimer=setTimeout(()=>{
    if(!windowBusy) measureBlocks(resizeAnchor || visibleAnchor());
    resizeAnchor=null;scheduleWindow();
  },120);
});
elQ.addEventListener('input',applyFilters);
elU.addEventListener('input',applyFilters);
elToggleTime.addEventListener('click',async e=>{
  e.stopPropagation();e.currentTarget.blur();
  SHOW_TIME=!SHOW_TIME;updateMainTimeButton();heights=[];
  await showWindow(targetBlock(),true);
});

/* Selection endpoints belong to logical rows, not ephemeral DOM nodes. A native
   range is projected onto its visible intersection; PNG uses the full range. */
function selectionPoint(node,offset){
  const element=node?.nodeType===3 ? node.parentElement : node;
  const row=element?.closest?.('#list .row');
  if(!row) return null;
  const range=document.createRange();range.selectNodeContents(row);range.setEnd(node,offset);
  return {id:Number(row.dataset.id),offset:range.toString().length};
}
function selectionSignature(sel){
  return sel?.rangeCount ? [sel.anchorNode,sel.anchorOffset,sel.focusNode,sel.focusOffset] : [];
}
function rememberSelection(){
  const sel=window.getSelection();const sig=selectionSignature(sel);
  if(projectedSelection && sig.length===projectedSelection.length && sig.every((v,i)=>v===projectedSelection[i])) return;
  if(selectionGesture?.active && !elList.querySelector(`.row[data-id="${selectionGesture.anchor.id}"]`)){
    const focus=pointAtPointer(selectionGesture.x,selectionGesture.y);
    if(focus){selectionRange={anchor:selectionGesture.anchor,focus};projectSelection();}
    return;
  }
  const anchor=selectionPoint(sel?.anchorNode,sel?.anchorOffset);
  const focus=selectionPoint(sel?.focusNode,sel?.focusOffset);
  if(!anchor || !focus || sel.isCollapsed){selectionRange=null;return;}
  // A clipped native endpoint still represents its original off-window endpoint.
  const same=(a,b)=>a && b && a.id===b.id && a.offset===b.offset;
  const oldAnchor=projectedSelection && selectionPoint(projectedSelection[0],projectedSelection[1]);
  const oldFocus=projectedSelection && selectionPoint(projectedSelection[2],projectedSelection[3]);
  selectionRange={anchor:same(anchor,oldAnchor)&&selectionRange ? selectionRange.anchor : anchor,
                  focus:same(focus,oldFocus)&&selectionRange ? selectionRange.focus : focus};
}
function domPoint(point){
  const first=windowStart*CHUNK,last=Math.min(windowEnd*CHUNK,rowCount())-1;
  const id=Math.max(first,Math.min(last,point.id));
  const row=elList.querySelector(`.row[data-id="${id}"]`);
  if(!row) return null;
  let offset=point.id<first ? 0 : point.id>last ? row.textContent.length : point.offset;
  return textPoint(row,offset);
}
function textPoint(row,offset){
  const walker=row.ownerDocument.createTreeWalker(row,NodeFilter.SHOW_TEXT);
  let node;
  while(node=walker.nextNode()){
    if(offset<=node.length) return [node,offset];
    offset-=node.length;
  }
  return [row,row.childNodes.length];
}
function projectSelection(){
  if(!selectionRange) return;
  const sel=window.getSelection();const {anchor,focus}=selectionRange;
  const a=domPoint(anchor),f=domPoint(focus);
  if(a && f) sel.setBaseAndExtent(...a,...f);
  projectedSelection=selectionSignature(sel);
}
document.addEventListener('selectionchange',()=>{if(!windowBusy) rememberSelection();});
function pointAtPointer(x,y){
  const outside=y<0 || y>=innerHeight;
  const cy=Math.max(0,Math.min(innerHeight-1,y));
  let point;
  if(document.caretPositionFromPoint){
    const p=document.caretPositionFromPoint(x,cy);
    point=p && selectionPoint(p.offsetNode,p.offset);
  }else{
    const range=document.caretRangeFromPoint?.(x,cy);
    point=range && selectionPoint(range.startContainer,range.startOffset);
  }
  if(point || !outside) return point;
  const visible=[...elList.querySelectorAll('.row')].filter(n=>{
    const r=n.getBoundingClientRect();return r.bottom>0 && r.top<innerHeight;
  });
  const row=y<0 ? visible[0] : visible.at(-1);
  return row && selectionPoint(row,y<0 ? 0 : row.childNodes.length);
}
elList.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse' || e.button!==0) return;
  const anchor=e.shiftKey && selectionRange ? selectionRange.anchor : pointAtPointer(e.clientX,e.clientY);
  if(!e.shiftKey){selectionRange=null;projectedSelection=null;}
  selectionGesture=anchor ? {anchor,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,active:false} : null;
});
window.addEventListener('pointermove',e=>{
  if(!selectionGesture || !(e.buttons&1)) return;
  const gesture=selectionGesture;gesture.x=e.clientX;gesture.y=e.clientY;
  if(Math.abs(e.clientX-gesture.startX)+Math.abs(e.clientY-gesture.startY)>3) gesture.active=true;
  if(gesture.active && !elList.querySelector(`.row[data-id="${gesture.anchor.id}"]`)){
    const focus=pointAtPointer(e.clientX,e.clientY);
    if(focus){selectionRange={anchor:gesture.anchor,focus};projectSelection();}
  }
});
window.addEventListener('pointerup',()=>{rememberSelection();selectionGesture=null;});
window.addEventListener('pointercancel',()=>{selectionGesture=null;});
// Native copy cannot see evicted nodes. Recreate only their textual projection;
// no DOM or image requests are needed. Preserve partial endpoint text offsets.
function selectionText(r){
  const plain=text=>String(text||'').split(/(\s+)/).filter(p=>{
    const clean=p.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'');
    return !catalogEmoteUrl(LOCAL_EMOTES,clean) && !catalogEmoteUrl(CDN_EMOTES,clean) && !EMOTES.has(clean);
  }).join('');
  let message='';
  if(Array.isArray(r.fragments) && r.fragments.length){
    let rendered=false;
    for(const f of r.fragments){
      if(!f || typeof f!=='object') continue;
      const raw=String(f.text||''),clean=raw.replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/[\r\n\t]/g,'').trim();
      if(f.emoteID || f.emote?.emoteID || f.emote?.id || clean && (catalogEmoteUrl(LOCAL_EMOTES,clean) || catalogEmoteUrl(CDN_EMOTES,clean))){rendered=true;continue;}
      if(raw){message+=plain(raw);rendered=true;}
    }
    if(!rendered) message=plain(r.text);
  }else message=plain(r.text);
  return (SHOW_TIME ? String(r.t||'00:00:00').replace(/\s*:\s*/g,':') : '')+(r.user||'—')+':'+message;
}
document.addEventListener('copy',event=>{
  rememberSelection();
  if(!selectionRange || !event.clipboardData) return;
  let {anchor:a,focus:f}=selectionRange;
  if(a.id>f.id || a.id===f.id && a.offset>f.offset) [a,f]=[f,a];
  if(a.id>=windowStart*CHUNK && f.id<windowEnd*CHUNK) return;
  const text=[];
  // A document without a browsing context keeps rich clipboard content inert:
  // image URLs are serialized, never fetched for off-window clipboard rows.
  const inert=document.implementation.createHTMLDocument('');
  const rich=inert.createElement('div');
  for(let i=a.id;i<=f.id;i++){
    const item=rowAt(i);
    let line=selectionText(item);
    rich.appendChild(createRowElement(item,SHOW_TIME,i,inert));
    if(i===f.id) line=line.slice(0,f.offset);
    if(i===a.id) line=line.slice(a.offset);
    text.push(line);
  }
  const range=inert.createRange();
  range.setStart(...textPoint(rich.firstChild,a.offset));
  range.setEnd(...textPoint(rich.lastChild,f.offset));
  const selected=inert.createElement('div');selected.appendChild(range.cloneContents());
  event.clipboardData.setData('text/html',selected.innerHTML);
  event.clipboardData.setData('text/plain',text.join('\n'));event.preventDefault();
});


/* Snapshot overlay: render the selected logical rows afresh for every toggle. */
let SNAPSHOT_TIME_ENABLED = SHOW_TIME;
let SNAPSHOT_DATE_ENABLED = false;
let SNAPSHOT_RENDER_TOKEN = 0;
let SNAPSHOT_OVERLAY = null;
let SNAPSHOT_PREVIEW_IMG = null;
let SNAPSHOT_TIME_BTN = null;
let SNAPSHOT_DATE_BTN = null;

function snapshotRows(from,to){
  const indices=filtered;
  return {length:to-from+1,at:i=>decodeMessage(rows[indices===null ? from+i : indices[from+i]])};
}
async function buildSnapshotWrap(rowsToUse, includeTime, includeDate){
  const wrap = document.createElement("div");
  wrap.className = "export-wrap";
  if(!includeTime){
    wrap.classList.add("snapshot-hide-time");
  }

  for(let idx=0;idx<rowsToUse.length;idx++){
    wrap.appendChild(createRowElement(rowsToUse.at(idx),includeTime,idx));
    if(idx%100===99) await yieldViewer();
  }

  if(includeDate){
    const metaRow = document.createElement("div");
    metaRow.className = "export-meta";
    const metaRight = document.createElement("div");
    metaRight.className = "export-meta-right";

    const dateIcon = document.createElement("span");
    dateIcon.textContent = "📅";
    const dateText = document.createElement("span");
    dateText.textContent = streamStart || "—";

    metaRight.appendChild(dateIcon);
    metaRight.appendChild(dateText);
    metaRow.appendChild(metaRight);
    wrap.appendChild(metaRow);
  }

  return wrap;
}

async function waitImages(root){
  const imgs=[...root.querySelectorAll("img")];
  await Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=img.onerror=res; })));
}

async function createSnapshotDataUrl(rowsToClone, includeTime, includeDate){
  const wrap = await buildSnapshotWrap(rowsToClone, includeTime, includeDate);
  document.body.appendChild(wrap);
  await new Promise(r=>setTimeout(r,50));
  await waitImages(wrap);

  let canvas;
  try{
    canvas = await html2canvas(wrap,{backgroundColor:"#18181f",useCORS:true,allowTaint:false,scale:2});
  }finally{
    if(wrap.parentNode){
      document.body.removeChild(wrap);
    }
  }

  return canvas.toDataURL("image/png");
}

const nextFrame = () => new Promise(requestAnimationFrame);

function updateSnapshotTimeButton(){
  if(!SNAPSHOT_TIME_BTN) return;
  SNAPSHOT_TIME_BTN.classList.toggle("is-active", SNAPSHOT_TIME_ENABLED);
  SNAPSHOT_TIME_BTN.classList.toggle("is-inactive", !SNAPSHOT_TIME_ENABLED);
  SNAPSHOT_TIME_BTN.setAttribute("aria-pressed", SNAPSHOT_TIME_ENABLED ? "true" : "false");
}

function updateSnapshotDateButton(){
  if(!SNAPSHOT_DATE_BTN) return;
  SNAPSHOT_DATE_BTN.classList.toggle("is-active", SNAPSHOT_DATE_ENABLED);
  SNAPSHOT_DATE_BTN.classList.toggle("is-inactive", !SNAPSHOT_DATE_ENABLED);
  SNAPSHOT_DATE_BTN.setAttribute("aria-pressed", SNAPSHOT_DATE_ENABLED ? "true" : "false");
}

async function rerenderSnapshotPreview(rowsToClone){
  const token = ++SNAPSHOT_RENDER_TOKEN;
  if(SNAPSHOT_PREVIEW_IMG){
    SNAPSHOT_PREVIEW_IMG.style.opacity = "0.55";
  }

  try{
    const url = await createSnapshotDataUrl(rowsToClone, SNAPSHOT_TIME_ENABLED, SNAPSHOT_DATE_ENABLED);
    if(token !== SNAPSHOT_RENDER_TOKEN) return;
    if(SNAPSHOT_PREVIEW_IMG){
      SNAPSHOT_PREVIEW_IMG.src = url;
      SNAPSHOT_PREVIEW_IMG.style.display = "block";

      const loader = SNAPSHOT_PREVIEW_IMG.closest(".snapshot-panel").querySelector(".snapshot-loader");
      if(loader) loader.remove();
      const panel = SNAPSHOT_PREVIEW_IMG?.closest(".snapshot-panel");
      const actions = panel?.querySelector(".snapshot-actions");
      if(actions) actions.classList.add("is-ready");
      SNAPSHOT_PREVIEW_IMG.style.opacity = "1";
    }
  }catch(err){
    if(token !== SNAPSHOT_RENDER_TOKEN) return;
    console.error("PNG render error:", err);
    if(SNAPSHOT_PREVIEW_IMG){
      SNAPSHOT_PREVIEW_IMG.style.opacity = "1";
    }
    const msg = String(err).toLowerCase();
    if(msg.includes("size")||msg.includes("dimension")||msg.includes("height")) alert("Слишком большой фрагмент. Браузер не смог создать изображение.");
    else alert("Ошибка создания изображения. Попробуйте уменьшить фрагмент.");
  }
}

function openSnapshotOverlay(rowsToClone){
  if(SNAPSHOT_OVERLAY){
    SNAPSHOT_OVERLAY.remove();
    SNAPSHOT_OVERLAY = null;
    SNAPSHOT_PREVIEW_IMG = null;
    SNAPSHOT_TIME_BTN = null;
    SNAPSHOT_DATE_BTN = null;
  }

  SNAPSHOT_TIME_ENABLED = SHOW_TIME;
  SNAPSHOT_DATE_ENABLED = false;

  const overlay = document.createElement("div");
  overlay.className = "snapshot-overlay";

  const panel = document.createElement("div");
  panel.className = "snapshot-panel";

  const img = document.createElement("img");
  img.className = "snapshot-preview";
  img.alt = "";

  const actions = document.createElement("div");
  actions.className = "snapshot-actions";
  actions.classList.remove("is-ready");

  const timeBtn = document.createElement("button");
  timeBtn.type = "button";
  timeBtn.className = "snapshot-toggle";
  timeBtn.textContent = "⏱️ Время";
  timeBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    SNAPSHOT_TIME_ENABLED = !SNAPSHOT_TIME_ENABLED;
    updateSnapshotTimeButton();
    await nextFrame();
    await rerenderSnapshotPreview(rowsToClone);
  });

  const dateBtn = document.createElement("button");
  dateBtn.type = "button";
  dateBtn.className = "snapshot-toggle";
  dateBtn.textContent = "📅 Дата";
  dateBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    SNAPSHOT_DATE_ENABLED = !SNAPSHOT_DATE_ENABLED;
    updateSnapshotDateButton();
    await nextFrame();
    await rerenderSnapshotPreview(rowsToClone);
  });

  SNAPSHOT_OVERLAY = overlay;
  SNAPSHOT_PREVIEW_IMG = img;
  SNAPSHOT_TIME_BTN = timeBtn;
  SNAPSHOT_DATE_BTN = dateBtn;
  updateSnapshotTimeButton();
  updateSnapshotDateButton();

  actions.appendChild(timeBtn);
  actions.appendChild(dateBtn);
  panel.appendChild(img);

  const loader = document.createElement("div");
  loader.className = "snapshot-loader";
  panel.appendChild(loader);

  panel.appendChild(actions);
  overlay.appendChild(panel);

  overlay.addEventListener("click", ()=>{
    if(elHeader){
      PANEL_DRAG = null;
      elHeader.classList.remove("is-dragging");
    }

    overlay.remove();
    SNAPSHOT_OVERLAY = null;
    SNAPSHOT_PREVIEW_IMG = null;
    SNAPSHOT_TIME_BTN = null;
    SNAPSHOT_DATE_BTN = null;
    document.body.style.overflow = "";
  });

  panel.addEventListener("click", (e)=>e.stopPropagation());
  document.body.style.overflow = "hidden";
  document.body.appendChild(overlay);

  rerenderSnapshotPreview(rowsToClone);
}

elExportBtn.addEventListener("pointerup", async (e)=>{
  e.stopPropagation();
  e.preventDefault();

  if(elHeader.hasPointerCapture(e.pointerId)){
  elHeader.releasePointerCapture(e.pointerId);
  }
  PANEL_DRAG = null;
  elHeader.classList.remove("is-dragging");

  await new Promise(r => setTimeout(r, 30)); // ← ДОБАВИТЬ

  rememberSelection();
  if(!selectionRange){alert("Выделите текст сообщений");return;}
  const from=Math.min(selectionRange.anchor.id,selectionRange.focus.id);
  const to=Math.max(selectionRange.anchor.id,selectionRange.focus.id);
  const rowsToClone=snapshotRows(from,to);
  selectionRange=null;projectedSelection=null;
  window.getSelection()?.removeAllRanges();
  openSnapshotOverlay(rowsToClone);
});

applyFilters();
</script>
